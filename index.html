<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Jurídica · SETP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

:root{
  --navy:#01274B; --navy-2:#0A3A6B; --blue:#3D85C6; --blue-soft:#BBD6EE;
  --ocobo:#D6488E; --ocobo-soft:#F6D6E7;
  --cream:#F6F3EC; --paper:#FFFFFF; --ink:#152238; --ink-soft:#5B6B82; --line:#E3E1D8;
  --green:#1E8F5F; --green-bg:#E3F5EC;
  --amber:#C1710A; --amber-bg:#FBEED9;
  --red:#C6362B; --red-bg:#FBE5E2;
  --shadow: 0 1px 2px rgba(1,39,75,.06), 0 8px 24px -12px rgba(1,39,75,.18);
  --radius: 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#0A1526; --paper:#111F35; --ink:#EAEDF3; --ink-soft:#93A2B8; --line:#213249;
    --blue-soft:#1D3555; --ocobo-soft:#3A1E33;
    --green-bg:#123626; --amber-bg:#3A2A0C; --red-bg:#3A1613;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --cream:#0A1526; --paper:#111F35; --ink:#EAEDF3; --ink-soft:#93A2B8; --line:#213249;
  --blue-soft:#1D3555; --ocobo-soft:#3A1E33;
  --green-bg:#123626; --amber-bg:#3A2A0C; --red-bg:#3A1613;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
body{background:var(--cream); color:var(--ink); font-family:'Manrope',system-ui,sans-serif; padding:0 16px; padding-block:20px 48px; min-height:100%;}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; text-wrap:balance;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;}
.wrap{max-width:1180px; margin:0 auto;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--ocobo-soft);}

/* ---------- decorative ocobo petals ---------- */
.ocobo-field{position:relative; overflow:hidden; height:0;}
.petal{position:absolute; top:-10px; width:10px; height:14px; background:var(--ocobo); border-radius:60% 10% 60% 10%; opacity:.55; animation:fall linear infinite;}
@keyframes fall{ to{ transform:translateY(160px) rotate(200deg); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .petal{animation:none; display:none;} }

/* ---------- top bar ---------- */
.topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:14px 18px; background:linear-gradient(135deg,var(--navy),var(--navy-2)); border-radius:var(--radius); color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;}
@media (max-width:560px){ .topbar .who{text-align:left;} .topbar .spacer{display:none;} .topbar{padding-bottom:16px;} }
.topbar .logo{width:46px; height:46px; border-radius:10px; flex:none; background:var(--navy);}
.topbar .brand{display:flex; flex-direction:column; line-height:1.15;}
.topbar .brand b{font-family:'Fraunces',serif; font-size:1.05rem; font-weight:800;}
.topbar .brand span{font-size:.72rem; opacity:.75; letter-spacing:.04em; text-transform:uppercase;}
.topbar .spacer{flex:1;}
.topbar .who{font-size:.85rem; text-align:right; opacity:.9;}
.topbar .who b{display:block; font-size:1rem;}
.route-track{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.18); pointer-events:none;}
.route-bus{position:absolute; bottom:-9px; font-size:20px; animation:drive 9s linear infinite;}
@keyframes drive{ 0%{left:-5%;} 100%{left:103%;} }
@media (prefers-reduced-motion: reduce){ .route-bus{animation:none; left:20px;} }
.logout-btn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; padding:8px 14px; border-radius:999px; font-size:.8rem; font-weight:700;}
.logout-btn:hover{background:rgba(255,255,255,.24);}

/* ---------- login screen ---------- */
.login-hero{text-align:center; padding:38px 10px 8px;}
.login-hero h1{font-size:clamp(1.6rem,4vw,2.4rem); font-weight:800; color:var(--title); margin:10px 0 6px;}
.login-hero p{color:var(--ink-soft); max-width:480px; margin:0 auto; font-size:.95rem;}
.login-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); max-width:380px; margin:30px auto 0; padding:26px 26px 22px;}
.login-card .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.login-card label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}
.login-card input{border:1px solid var(--line); border-radius:8px; padding:11px 13px; font-size:.95rem; background:var(--cream); color:var(--ink);}
.login-card input:focus{outline:none; border-color:var(--blue);}
.login-card button{width:100%; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:12px; font-weight:700; font-size:.9rem; margin-top:6px;}
.login-card button:hover{filter:brightness(1.15);}
.login-card .err{color:var(--red); font-size:.78rem; min-height:1.2em; text-align:center; margin-top:8px;}
.profiles-hint{max-width:380px; margin:16px auto 0; text-align:center; font-size:.76rem; color:var(--ink-soft); line-height:1.6;}
.profiles-hint b{color:var(--ink);}

/* ---------- dashboard layout ---------- */
.grid{display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px;}
.grid > *{min-width:0;}
@media (max-width:820px){ .grid{grid-template-columns:1fr;} }
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; min-width:0;}
.card h2{font-size:1rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; color:var(--title);}
.card h2 .n{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft); font-weight:600;}

.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:16px 0;}
@media (max-width:820px){ .kpis{grid-template-columns:repeat(3,1fr);} }
@media (max-width:480px){ .kpis{grid-template-columns:repeat(2,1fr);} }
.kpi{border-radius:12px; padding:12px 10px; color:#fff; text-align:center; box-shadow:var(--shadow); position:relative;}
.kpi .lbl{font-size:.63rem; text-transform:uppercase; letter-spacing:.05em; opacity:.85;}
.kpi .val{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.6rem; margin-top:2px; animation:flip .5s ease;}
@keyframes flip{ from{opacity:0; transform:translateY(6px) rotateX(40deg);} to{opacity:1; transform:none;} }
.kpi.navy{background:var(--navy);} .kpi.blue{background:var(--blue);}
.kpi.green{background:var(--green);} .kpi.amber{background:var(--amber);}
.kpi.red{background:var(--red);} .kpi.ocobo{background:var(--ocobo);}

/* balanza */
.balanza-block{text-align:center;}
.balanza-pct{font-family:'Fraunces',serif; font-weight:800; font-size:2.2rem; line-height:1;}
.balanza-pct-lbl{font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:3px 0 6px;}
.balanza-caption{font-size:.78rem; color:var(--ink-soft); max-width:290px; margin:8px auto 0; line-height:1.45;}
.balanza-caption b{color:var(--ink);}
.beam{transform-origin:110px 46px; transition:transform 1.1s cubic-bezier(.34,1.4,.5,1);}

/* donut */
.donut-wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.donut-wrap svg{flex:none;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:.8rem;}
.legend .row{display:flex; align-items:center; gap:7px;}
.legend .dot{width:10px; height:10px; border-radius:3px;}
.donut-seg{transition:stroke-dasharray 1s ease;}

/* table */
.tbl-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.82rem; min-width:760px;}
th{text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:6px 8px; border-bottom:2px solid var(--line);}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr.example-row{background:var(--ocobo-soft);}
td input,td select{width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:4px 6px; color:var(--ink); font-size:.82rem;}
td input:hover,td select:hover{border-color:var(--line);}
td input:focus,td select:focus{border-color:var(--blue); background:var(--paper); outline:none;}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem; font-weight:700; white-space:nowrap;}
.pill.vigente{background:var(--green-bg); color:var(--green);}
.pill.proximo{background:var(--amber-bg); color:var(--amber);}
.pill.vencido{background:var(--red-bg); color:var(--red);}
.pill.respondido{background:var(--blue-soft); color:var(--title);}
.del-btn{background:none; border:none; color:var(--ink-soft); font-size:1rem; line-height:1;}
.del-btn:hover{color:var(--red);}
.add-row{margin-top:10px; background:var(--blue); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:700; font-size:.8rem;}
.add-row:hover{filter:brightness(1.08);}

/* urgent ticker */
.ticker-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; margin-bottom:7px; border:1px solid var(--line);}
.ticker-item.crit{background:var(--red-bg); border-color:transparent;}
.ticker-item.warn{background:var(--amber-bg); border-color:transparent;}
.ticker-item .flag{width:6px; align-self:stretch; border-radius:4px; background:var(--ink-soft); flex:none;}
.ticker-item.crit .flag{background:var(--red);}
.ticker-item.warn .flag{background:var(--amber);}
.ticker-item .body{flex:1; min-width:0;}
.ticker-item .who{font-size:.68rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ticker-item .what{font-size:.83rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ticker-item .when{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-soft); flex:none; text-align:right;}
.empty-note{color:var(--ink-soft); font-size:.85rem; text-align:center; padding:14px 0;}

/* email lock */
.mail-row{display:flex; gap:8px; align-items:center;}
.mail-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:.85rem; background:var(--cream); color:var(--ink);}
.mail-row input:disabled{color:var(--ink-soft);}
.lock-btn{flex:none; width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:1.05rem; display:flex; align-items:center; justify-content:center;}
.lock-btn.locked{background:var(--green); border-color:var(--green); color:#fff;}
.mail-note{font-size:.72rem; color:var(--ink-soft); margin-top:6px;}

/* alerta de estado */
.alert-banner{display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:var(--radius); margin:16px 0; box-shadow:var(--shadow);}
.alert-banner .icon{font-size:1.8rem; flex:none; width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.35);}
.alert-banner .txt b{display:block; font-family:'Fraunces',serif; font-size:1.15rem;}
.alert-banner .txt span{font-size:.82rem; opacity:.9;}
.alert-banner.green{background:var(--green); color:#fff;}
.alert-banner.amber{background:var(--amber); color:#fff;}
.alert-banner.red{background:var(--red); color:#fff;}

/* control operativo: selector + comparativos */
.selector-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
.selector-row label{font-size:.78rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.selector-row select{border:1px solid var(--line); border-radius:8px; padding:9px 13px; font-size:.9rem; background:var(--paper); color:var(--ink); font-weight:700; min-width:200px;}
.cmp{margin-bottom:14px;}
.cmp .cmp-lbl{display:flex; justify-content:space-between; font-size:.76rem; color:var(--ink-soft); margin-bottom:4px;}
.cmp .cmp-bar{height:10px; border-radius:6px; background:var(--line); overflow:hidden; display:flex;}
.cmp .cmp-bar i{display:block; height:100%;}
.cmp .cmp-bar i.sel{background:var(--bar-sel);}
.cmp .cmp-bar i.team{background:var(--ocobo);}
.cmp-legend{display:flex; gap:16px; font-size:.72rem; color:var(--ink-soft); margin-top:10px;}
.cmp-legend span{display:flex; align-items:center; gap:5px;}
.cmp-legend i{width:9px; height:9px; border-radius:3px; display:inline-block;}

/* solo lectura */
.readonly-note{display:inline-flex; align-items:center; gap:6px; background:var(--blue-soft); color:var(--title); font-size:.72rem; font-weight:700; padding:4px 11px; border-radius:999px;}

/* vista general: filtros y orden por columna */
.vg-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px;}
.vg-toolbar input[type=search]{flex:1 1 240px; min-width:0; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:.85rem; background:var(--cream); color:var(--ink);}
.vg-toolbar input:focus{outline:none; border-color:var(--blue);}
.vg-count{font-size:.78rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.vg-clear{background:var(--blue-soft); color:var(--title); border:none; border-radius:999px; padding:7px 14px; font-size:.75rem; font-weight:700;}
.vg-clear[hidden]{display:none;}
.vg-tip{color:var(--ink-soft); font-size:.8rem; margin:-4px 0 12px;}
th.vg-th{cursor:pointer; user-select:none; white-space:nowrap; border-bottom:1px solid var(--line);}
th.vg-th:hover, th.vg-th.on{color:var(--title);}
th.vg-th .ar{opacity:.35; margin-left:4px; font-size:.7rem;}
th.vg-th.on .ar{opacity:1; color:var(--ocobo);}
th.vg-th:focus-visible{outline:2px solid var(--blue); outline-offset:-2px;}
tr.vg-filters th{padding:5px 6px 9px; text-transform:none; letter-spacing:0; font-weight:400; vertical-align:top;}
.vg-filters input,.vg-filters select{width:100%; min-width:92px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; font-size:.75rem; background:var(--cream); color:var(--ink);}
.vg-filters .act, .vg-toolbar .act{border-color:var(--blue); background:var(--blue-soft);}
.vg-dates{display:flex; flex-direction:column; gap:3px;}
.vg-dates label{display:flex; align-items:center; gap:5px; font-size:.62rem; color:var(--ink-soft); text-transform:uppercase;}
.vg-dates label span{width:34px; flex:none;}

.tabs{display:flex; gap:6px; margin:16px 0 0; flex-wrap:wrap;}
.tab{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-weight:700; font-size:.82rem; color:var(--ink-soft);}
.tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.badge-demo{display:inline-block; background:var(--amber-bg); color:var(--amber); font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; margin-left:8px;}
.footnote{text-align:center; color:var(--ink-soft); font-size:.72rem; margin-top:28px; line-height:1.6;}

.save-status{font-size:.72rem; color:var(--ink-soft); margin-left:10px; font-weight:600;}
.save-status.ok{color:var(--green);} .save-status.err{color:var(--red);}
.msg{font-size:.78rem; margin-top:8px; min-height:1em;} .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.pw-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px;}
.pw-grid input{border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:.85rem; background:var(--cream); color:var(--ink);}
.btn-sec{margin-top:10px; background:var(--primary); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:.8rem;}
.btn-sec:disabled{opacity:.6; cursor:default;}
.del-btn.confirm{color:#fff; background:var(--red); border-radius:6px; padding:3px 8px; font-size:.7rem; font-weight:700;}
.empty-row{text-align:center; color:var(--ink-soft); padding:24px 8px; font-size:.85rem;}
.loading{text-align:center; padding:110px 10px; color:var(--ink-soft); font-weight:600;}
.spin{width:34px; height:34px; border:4px solid var(--line); border-top-color:var(--seg-navy); border-radius:50%; margin:0 auto 14px; animation:rot .9s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.two{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
.two > *{min-width:0;}
@media (max-width:820px){ .two{grid-template-columns:1fr;} }

/* ============================================================
   ANIMACIONES: buses, semáforos, balanza, mazo, ocobos, ciudad
   ============================================================ */

/* entrada suave de cada bloque */
@keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
#body > *, .login-hero, .login-card{ animation:rise .55s cubic-bezier(.2,.8,.2,1) both; }
#body > *:nth-child(2){animation-delay:.06s;} #body > *:nth-child(3){animation-delay:.12s;}
#body > *:nth-child(4){animation-delay:.18s;} #body > *:nth-child(5){animation-delay:.24s;}
#app > :not(.petalos):not(.fondo-vivo){ position:relative; z-index:1; }

/* pétalos de ocobo cayendo (quedan detrás de las tarjetas) */
.petalos{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.petalos i{ position:absolute; top:-24px; width:11px; height:15px; background:var(--ocobo); border-radius:70% 10% 70% 10%; opacity:0; animation:petalo linear infinite; }
@keyframes petalo{ 0%{transform:translate3d(0,-24px,0) rotate(0); opacity:0;} 8%{opacity:.5;} 100%{transform:translate3d(var(--dx),108vh,0) rotate(560deg); opacity:.05;} }

/* carril de la barra superior + bus */
.route-track{ height:4px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.4) 0 14px, transparent 14px 28px); background-size:28px 4px; animation:carril 1.2s linear infinite; }
@keyframes carril{ to{ background-position:-28px 0; } }
.route-bus{ bottom:2px; font-size:0; }
.topbar{ padding-bottom:28px; }
.bus-svg{ display:block; }
.wh{ transform-box:fill-box; transform-origin:center; animation:rot .55s linear infinite; }

/* semáforo */
.semaforo{ display:block; }
.lamp{ opacity:.2; }
.lamp.r{ fill:#E5483B; } .lamp.a{ fill:#F5A623; } .lamp.g{ fill:#26B67A; }
.lamp.on{ opacity:1; }
.lamp.r.on{ filter:drop-shadow(0 0 5px #E5483B); animation:blink 1.1s steps(1) infinite; }
.lamp.a.on{ filter:drop-shadow(0 0 5px #F5A623); animation:pulso 1.6s ease-in-out infinite; }
.lamp.g.on{ filter:drop-shadow(0 0 5px #26B67A); animation:pulsoV 2.6s ease-in-out infinite; }
.lamp.cr{ animation:cR 7s infinite; } .lamp.cg{ animation:cG 7s infinite; } .lamp.ca{ animation:cA 7s infinite; }
@keyframes blink{ 0%,58%{opacity:1;} 59%,100%{opacity:.25;} }
@keyframes pulso{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
@keyframes pulsoV{ 0%,100%{opacity:.8;} 50%{opacity:1;} }
@keyframes cR{ 0%,34%{opacity:1;} 36%,100%{opacity:.2;} }
@keyframes cG{ 0%,37%{opacity:.2;} 39%,72%{opacity:1;} 74%,100%{opacity:.2;} }
@keyframes cA{ 0%,75%{opacity:.2;} 77%,90%{opacity:1;} 92%,100%{opacity:.2;} }

/* alerta: semáforo + latido en rojo */
.alert-banner .icon{ width:46px; height:76px; border-radius:14px; background:rgba(255,255,255,.2); }
.alert-banner.red{ animation:latido 2.4s ease-in-out infinite; }
@keyframes latido{ 0%,100%{ box-shadow:var(--shadow); } 50%{ box-shadow:0 0 0 6px rgba(198,54,43,.22), var(--shadow); } }

/* iconos de derecho (quietos; se mueven al pasar el mouse o cuando son "live") */
.ico{ display:inline-block; flex:none; vertical-align:middle; overflow:visible; }
.ico [class^="ic-"], .ico .ic-dot{ animation-play-state:paused; }
.ico:hover [class^="ic-"], .ico.live [class^="ic-"], tr:hover .ico [class^="ic-"]{ animation-play-state:running; }
.ic-beam{ transform-origin:28px 14px; animation:icBeam 3.2s ease-in-out infinite; }
@keyframes icBeam{ 0%,100%{ transform:rotate(-9deg); } 50%{ transform:rotate(9deg); } }
.ic-mazo{ transform-origin:16px 46px; animation:icMazo 1.9s ease-in-out infinite; }
@keyframes icMazo{ 0%{ transform:rotate(-60deg); } 30%{ transform:rotate(0); } 36%{ transform:rotate(-9deg); } 42%{ transform:rotate(0); } 100%{ transform:rotate(-60deg); } }
.ic-spark{ animation:icSpark 1.9s ease-out infinite; opacity:0; }
@keyframes icSpark{ 0%,29%{ opacity:0; } 31%{ opacity:1; } 46%,100%{ opacity:0; } }
.ic-paper{ animation:icPaper 3.4s ease-in-out infinite; }
@keyframes icPaper{ 0%,18%,92%,100%{ transform:translateY(20px); } 45%,62%{ transform:translateY(0); } }
.ic-closed{ animation:icClosed 3.4s infinite; } .ic-open{ animation:icOpen 3.4s infinite; }
@keyframes icClosed{ 0%,15%,88%,100%{ opacity:1; } 24%,78%{ opacity:0; } }
@keyframes icOpen{ 0%,15%,88%,100%{ opacity:0; } 24%,78%{ opacity:1; } }
.ic-esc{ transform-origin:28px 28px; animation:icPulse 2.2s ease-in-out infinite; }
@keyframes icPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.09); } }
.ic-ring{ transform-origin:28px 28px; animation:icRing 2.2s ease-out infinite; }
@keyframes icRing{ 0%{ transform:scale(.8); opacity:.9; } 100%{ transform:scale(1.9); opacity:0; } }
.ic-dot{ animation:icDot 1.3s ease-in-out infinite; }
.ic-dot.d2{ animation-delay:.16s; } .ic-dot.d3{ animation-delay:.32s; }
@keyframes icDot{ 0%,55%,100%{ transform:translateY(0); } 28%{ transform:translateY(-5px); } }
.ic-lupa{ animation:icLupa 3.4s ease-in-out infinite; }
@keyframes icLupa{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(4px,-2px); } 50%{ transform:translate(0,3px); } 75%{ transform:translate(-4px,-1px); } }
.tipo-cell{ display:flex; align-items:center; gap:8px; }

/* portada (login) */

/* KPI: brillo que recorre la tarjeta y efecto al pasar el mouse */
.kpi{ overflow:hidden; transition:transform .25s ease, box-shadow .25s ease; }
.kpi:hover{ transform:translateY(-3px); }
.kpi::after{ content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.3) 50%, transparent 62%); transform:translateX(-130%); animation:brillo 4.2s ease-in-out infinite; pointer-events:none; }
.kpi:nth-child(2)::after{ animation-delay:.5s; } .kpi:nth-child(3)::after{ animation-delay:1s; } .kpi:nth-child(4)::after{ animation-delay:1.5s; }
.kpi:nth-child(5)::after{ animation-delay:2s; } .kpi:nth-child(6)::after{ animation-delay:2.5s; }
@keyframes brillo{ 0%,55%{ transform:translateX(-130%); } 80%,100%{ transform:translateX(130%); } }

/* balanza: se inclina hasta su posición y luego se mece */
.beam{ transform:rotate(var(--a,0deg)); animation:settle 1.5s cubic-bezier(.34,1.4,.5,1) both, sway 5s ease-in-out 1.5s infinite; }
@keyframes settle{ from{ transform:rotate(0deg); } }
@keyframes sway{ 0%,100%{ transform:rotate(var(--a,0deg)); } 25%{ transform:rotate(calc(var(--a,0deg) + 2.2deg)); } 75%{ transform:rotate(calc(var(--a,0deg) - 2.2deg)); } }

/* dona y barras que "se dibujan" */
.donut-seg{ animation:dib 1.1s cubic-bezier(.3,.8,.3,1) both; }
@keyframes dib{ from{ stroke-dasharray:0 400; } }
.cmp .cmp-bar i{ transform-origin:left center; animation:growx 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes growx{ from{ transform:scaleX(0); } }

/* Ruta de plazos: cada bus avanza hacia la bandera (fecha límite) */
.ruta-row{ display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:center; padding:9px 0; border-bottom:1px dashed var(--line); }
.ruta-row:last-child{ border-bottom:0; }
.ruta-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:.78rem; margin-bottom:2px; }
.ruta-name{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.ruta-when{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--ink-soft); flex:none; }
.ruta-row.vencido .ruta-when{ color:var(--red); font-weight:700; }
.ruta-row.proximo .ruta-when{ color:var(--amber); font-weight:700; }
.ruta-lane{ position:relative; height:32px; margin-right:16px; }
.ruta-road{ position:absolute; left:0; right:0; bottom:3px; height:8px; border-radius:4px; background:var(--navy); overflow:hidden; }
.ruta-road::after{ content:""; position:absolute; left:0; right:0; top:3px; height:2px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 7px, transparent 7px 14px); background-size:14px 2px; animation:carril 1s linear infinite; }
.ruta-fill{ position:absolute; left:0; bottom:3px; height:8px; border-radius:4px; width:var(--p); background:var(--green); transform-origin:left center; animation:growx 1.5s cubic-bezier(.22,.9,.3,1) both; z-index:1; opacity:.9; }
.ruta-row.proximo .ruta-fill{ background:var(--amber); } .ruta-row.vencido .ruta-fill{ background:var(--red); }
.ruta-bus{ position:absolute; bottom:4px; left:var(--p); translate:-100% 0; z-index:2; animation:ir 1.5s cubic-bezier(.22,.9,.3,1) both; }
.ruta-row.vencido .ruta-bus{ animation:ir 1.5s cubic-bezier(.22,.9,.3,1) both, tiembla .6s ease-in-out 1.5s infinite; }
@keyframes ir{ from{ left:0; } }
@keyframes tiembla{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-3deg) translateY(-1px); } 75%{ transform:rotate(3deg); } }
.ruta-flag{ position:absolute; right:-14px; bottom:3px; z-index:2; }
.ruta-flag svg{ display:block; }
.ruta-mas{ text-align:center; font-size:.75rem; color:var(--ink-soft); padding-top:6px; }
.ruta-vacia{ display:flex; align-items:center; gap:14px; padding:10px 0; color:var(--ink-soft); font-size:.88rem; overflow:hidden; }
.ruta-vacia .bus-svg{ animation:pasea 5s ease-in-out infinite alternate; }
@keyframes pasea{ from{ transform:translateX(0); } to{ transform:translateX(60px); } }
.ruta-help{ color:var(--ink-soft); font-size:.78rem; margin:-4px 0 8px; }

/* escena de ciudad (pie de página) */
.ciudad{ margin-top:26px; border-radius:var(--radius); overflow:hidden; line-height:0; }
.ciudad svg{ width:100%; height:auto; display:block; }
.bld{ fill:var(--blue-soft); opacity:.55; } .bld2{ fill:var(--line); }
.pal{ fill:var(--paper); stroke:var(--line); stroke-width:1.5; }
.via{ fill:var(--navy); }
.raya{ stroke:rgba(255,255,255,.8); stroke-width:2.4; stroke-dasharray:22 22; animation:raya 1.1s linear infinite; }
@keyframes raya{ to{ stroke-dashoffset:-44; } }
.v1{ animation:cruzar 17s linear infinite; }
.v2{ animation:cruzarIzq 26s linear infinite; animation-delay:-9s; }
@keyframes cruzar{ from{ transform:translateX(-140px); } to{ transform:translateX(1060px); } }
@keyframes cruzarIzq{ from{ transform:translateX(1060px); } to{ transform:translateX(-140px); } }
.arbol{ transform-box:fill-box; transform-origin:50% 100%; animation:mece 5s ease-in-out infinite; }
.arbol.b{ animation-delay:-1.7s; } .arbol.c{ animation-delay:-3.1s; }
@keyframes mece{ 0%,100%{ transform:rotate(-1.6deg); } 50%{ transform:rotate(1.6deg); } }
.mini-beam{ transform-box:view-box; transform-origin:500px 40px; animation:miniBal 4s ease-in-out infinite; }
@keyframes miniBal{ 0%,100%{ transform:rotate(-9deg); } 50%{ transform:rotate(9deg); } }

/* celebración al registrar una respuesta */
.celebra{ position:fixed; left:50%; bottom:42px; z-index:60; pointer-events:none; text-align:center; background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:18px; padding:14px 26px 16px; animation:celeb 2.6s ease both; }
.celebra b{ display:block; font-family:'Fraunces',serif; font-size:1.05rem; color:var(--title); margin-top:4px; }
.celebra span{ font-size:.78rem; color:var(--ink-soft); }
.cel-burst{ position:absolute; left:50%; top:34%; }
.cel-burst i{ position:absolute; width:10px; height:14px; background:var(--ocobo); border-radius:70% 10% 70% 10%; animation:burst 1.5s ease-out both; }
@keyframes celeb{ 0%{ opacity:0; transform:translate(-50%,34px) scale(.9); } 12%{ opacity:1; transform:translate(-50%,0) scale(1); } 86%{ opacity:1; transform:translate(-50%,0); } 100%{ opacity:0; transform:translate(-50%,-12px); } }
@keyframes burst{ from{ transform:translate(0,0) scale(.4); opacity:1; } to{ transform:translate(var(--x),var(--y)) rotate(320deg) scale(1); opacity:0; } }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; animation-delay:0s !important; transition-duration:.001ms !important; }
  .petalos{ display:none; }
}

/* ============================================================
   V4: modo oscuro legible, ruta sin solapamientos, fondo vivo, normativa
   ============================================================ */
:root{ --title:#01274B; --primary:#01274B; --seg-navy:#01274B; --bar-sel:#01274B; --road:#01274B; --kpi-navy:#01274B; --wm:#0A3A6B; --wm-op:.11; color-scheme:light; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --title:#E3EEFA; --primary:#2F6DB0; --seg-navy:#7FB2E8; --bar-sel:#7FB2E8; --road:#0A2A4D; --kpi-navy:#12467F; --wm:#9CC4F0; --wm-op:.13; color-scheme:dark; }
}
:root[data-theme="dark"]{ --title:#E3EEFA; --primary:#2F6DB0; --seg-navy:#7FB2E8; --bar-sel:#7FB2E8; --road:#0A2A4D; --kpi-navy:#12467F; --wm:#9CC4F0; --wm-op:.13; color-scheme:dark; }
:root[data-theme="light"]{ color-scheme:light; }
.kpi.navy{ background:var(--kpi-navy); }
.ruta-road{ background:var(--road); box-shadow:0 0 0 1px rgba(127,178,232,.18); }
.via{ fill:var(--road); }
.semaforo rect:first-child{ stroke:#3B4F6B; stroke-width:1.2; }

/* botón claro/oscuro */
.theme-btn{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; width:38px; height:34px; border-radius:999px; font-size:1rem; line-height:1; flex:none; }
.theme-btn:hover{ background:rgba(255,255,255,.26); }
.topbar .theme-btn.solo{ margin-left:auto; }

/* ruta de plazos: el bus nunca se sale del carril (ya no tapa el icono) */
.ruta-fill{ width:calc(22px + (100% - 44px) * var(--f, 0)); }
.ruta-bus{ left:calc((100% - 44px) * var(--f, 0)); translate:none; }
.ruta-vacia{ display:block; padding:6px 0 2px; }
.rv-lane{ position:relative; height:34px; overflow:hidden; border-radius:8px; margin-bottom:6px; }
.rv-lane .ruta-road{ bottom:3px; }
.rv-bus{ position:absolute; bottom:4px; left:-60px; animation:rvCruza 9s linear infinite; }
@keyframes rvCruza{ from{ left:-60px; } to{ left:100%; } }
.rv-txt{ margin:0; text-align:center; color:var(--ink-soft); font-size:.88rem; }

/* ---------- portada: fondo vivo (marca de agua animada e interactiva) ---------- */
.fondo-vivo{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; color:var(--wm); --mx:0; --my:0; --tilt:0deg; --err:0deg; }
.fv{ width:100%; height:100%; display:block; }
.fv .capa{ transition:transform .5s cubic-bezier(.2,.8,.2,1); }
.fv .l1{ transform:translate(calc(var(--mx) * -8px), calc(var(--my) * -5px)); }
.fv .l2{ transform:translate(calc(var(--mx) * -20px), calc(var(--my) * -10px)); }
.fv .l3{ transform:translate(calc(var(--mx) * -38px), calc(var(--my) * -14px)); }
.fv .wm{ fill:currentColor; opacity:var(--wm-op); }
.fv .wm2{ fill:currentColor; opacity:calc(var(--wm-op) * 1.7); }
.fv .wm-line{ stroke:currentColor; fill:none; opacity:calc(var(--wm-op) * 2.4); stroke-linecap:round; }
.fv .wm-oc{ fill:var(--ocobo); opacity:.2; }
.fv .wm-oc2{ fill:var(--ocobo); opacity:.32; }
.fv .wm-bl{ fill:var(--blue); opacity:.22; }
.fv .wm-go{ fill:#E0A93A; opacity:.35; }
.fv .nube{ animation:nube 60s linear infinite; }
.fv .nube.n2{ animation-duration:85s; animation-delay:-30s; } .fv .nube.n3{ animation-duration:70s; animation-delay:-52s; }
@keyframes nube{ from{ transform:translateX(-360px); } to{ transform:translateX(1960px); } }
.fv .nota{ animation:notaSube 9s ease-in infinite; opacity:0; }
.fv .nota.q2{ animation-delay:-2.5s; } .fv .nota.q3{ animation-delay:-5s; } .fv .nota.q4{ animation-delay:-7s; }
@keyframes notaSube{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:.45; } 100%{ transform:translateY(-340px); opacity:0; } }
.fv .arbol{ transform-box:fill-box; transform-origin:50% 100%; animation:mece 6s ease-in-out infinite; }
.fv .arbol.b{ animation-delay:-2s; }
/* balanza gigante */
.bal-sway{ transform-origin:800px 300px; animation:balSway 7s ease-in-out infinite; }
@keyframes balSway{ 0%,100%{ transform:rotate(-1.4deg); } 50%{ transform:rotate(1.4deg); } }
.bal-beam{ transform-origin:800px 300px; transform:rotate(calc(var(--tilt) + var(--err))); transition:transform 1.1s cubic-bezier(.34,1.5,.5,1); }
.bal-glow{ opacity:0; transition:opacity .6s; }
.fondo-vivo.listo .bal-glow{ opacity:1; animation:glowP 1.6s ease-in-out infinite; }
@keyframes glowP{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }
.bal-glow{ transform-box:fill-box; transform-origin:center; }
.fondo-vivo.st-error{ --err:13deg; }
.fondo-vivo.st-error .fv{ animation:sacude .5s ease; }
@keyframes sacude{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-9px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(3px); } }
.fondo-vivo.st-ok .bal-beam{ transform:rotate(0deg); }
.fondo-vivo.st-ok .bal-glow{ opacity:1; }
/* mazo de fondo */
.mazo-fondo{ pointer-events:auto; cursor:pointer; }
.mz-mango{ transform-box:view-box; transform-origin:600px 690px; transform:rotate(-58deg); transition:transform .5s ease; }
.mazo-fondo:hover .mz-mango{ transform:rotate(-40deg); }
.mazo-fondo.golpe .mz-mango, .fondo-vivo.st-ok .mz-mango{ animation:golpeMazo .8s ease both; }
@keyframes golpeMazo{ 0%{ transform:rotate(-58deg); } 35%{ transform:rotate(0deg); } 48%{ transform:rotate(-12deg); } 60%{ transform:rotate(0deg); } 100%{ transform:rotate(-58deg); } }
.mz-chispa{ opacity:0; }
.mazo-fondo.golpe .mz-chispa, .fondo-vivo.st-ok .mz-chispa{ animation:chispa .8s ease-out both; }
@keyframes chispa{ 0%,30%{ opacity:0; } 38%{ opacity:1; } 70%,100%{ opacity:0; } }
.mz-toc{ opacity:0; font:800 30px 'Fraunces',serif; fill:var(--ocobo); }
.mazo-fondo.golpe .mz-toc, .fondo-vivo.st-ok .mz-toc{ animation:tocTxt .9s ease-out both; }
@keyframes tocTxt{ 0%,30%{ opacity:0; transform:translateY(0); } 40%{ opacity:.9; } 100%{ opacity:0; transform:translateY(-26px); } }
/* buses y semáforo de fondo (se pueden tocar) */
.vbus{ pointer-events:auto; cursor:pointer; }
.vb1{ animation:cruzaF 34s linear infinite; } .vb2{ animation:cruzaFizq 46s linear infinite; animation-delay:-18s; }
@keyframes cruzaF{ from{ transform:translateX(-260px); } to{ transform:translateX(1900px); } }
@keyframes cruzaFizq{ from{ transform:translateX(1900px); } to{ transform:translateX(-260px); } }
.vbus.acelera{ animation-duration:9s !important; }
.honk{ opacity:0; }
.honk text{ font:800 26px 'Manrope',sans-serif; fill:var(--ink); }
.honk rect{ fill:var(--paper); stroke:var(--line); stroke-width:2; }
.vbus.honk-on .honk{ animation:honkA 1.1s ease-out both; }
@keyframes honkA{ 0%{ opacity:0; transform:translateY(8px) scale(.8); } 15%{ opacity:1; transform:none; } 80%{ opacity:1; } 100%{ opacity:0; transform:translateY(-8px); } }
.fsem{ pointer-events:auto; cursor:pointer; }
.fsem .fl{ opacity:.18; transition:opacity .3s; }
.fv[data-luz="r"] .fl-r, .fv[data-luz="a"] .fl-a, .fv[data-luz="g"] .fl-g{ opacity:1; }
.fv[data-luz="r"] .fl-r{ filter:drop-shadow(0 0 8px #E5483B); } .fv[data-luz="a"] .fl-a{ filter:drop-shadow(0 0 8px #F5A623); } .fv[data-luz="g"] .fl-g{ filter:drop-shadow(0 0 8px #26B67A); }
.fun-hint{ text-align:center; max-width:420px; margin:14px auto 0; font-size:.74rem; color:var(--ink-soft); line-height:1.5; }
.login-card{ backdrop-filter:blur(2px); }

/* ---------- pestaña Normativa ---------- */
.nm-head p{ margin:0 0 10px; color:var(--ink-soft); font-size:.85rem; line-height:1.5; }
.nm-top{ display:grid; grid-template-columns:minmax(240px,300px) 1fr; gap:16px; margin-top:16px; }

.pir-l{ cursor:pointer; outline:none; transition:transform .25s ease, opacity .25s; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; }
.pir-l:nth-child(2){ animation-delay:.08s; } .pir-l:nth-child(3){ animation-delay:.16s; } .pir-l:nth-child(4){ animation-delay:.24s; }

.nm-num{ font-family:'Fraunces',serif; font-weight:800; font-size:3rem; line-height:1; color:var(--title); }
.nm-unit{ font-size:.78rem; color:var(--ink-soft); line-height:1.3; }
.nm-unit b{ display:block; color:var(--ink); font-size:.9rem; }
.nm-badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem; font-weight:800; color:#fff; }
.nm-badge.ley{ background:var(--blue); } .nm-badge.juez{ background:var(--ocobo); } .nm-badge.interno{ background:var(--green); }
.nm-panel p{ margin:8px 0 0; font-size:.84rem; line-height:1.5; }

.nm-card .uso{ font-size:.78rem; background:var(--cream); border-radius:8px; padding:8px 10px; margin:8px 0 6px; }

.nm-card a:hover{ text-decoration:underline; }
.nm-card .pie{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:.72rem; color:var(--ink-soft); }
.nm-card .flecha{ transition:transform .3s; display:inline-block; } .nm-card.open .flecha{ transform:rotate(180deg); }
.nm-card .tags{ display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }

.nm-vacio{ grid-column:1/-1; text-align:center; color:var(--ink-soft); padding:26px 0; font-size:.88rem; }
.fv .raya{ stroke-dasharray:60 50; stroke-width:7; animation:rayaF 3s linear infinite; }
@keyframes rayaF{ to{ stroke-dashoffset:-110; } }
.nm-grid.quieta .nm-card{ animation:none; }

   - en la página alojada fuera de Google (GitHub Pages, tu sitio): fetch, que no depende de las cuentas de Google del navegador.
   (Las barras de la dirección van escapadas: Google recorta el código que contenga "//" dentro de un texto.) */
const API_URL = "https:\/\/script.google.com\/macros\/s\/AKfycbwh302sYjlWRCTS20Gxzsj8T_u7Iw7bmPA3d-RcVZ0bCPAmp0thRFHKaX_m3gfFpiTQNg\/exec";
function api(fn, ...args){
  return (window.google && google.script && google.script.run) ? apiGoogle(fn, args) : apiWeb(fn, args);
}
async function apiWeb(fn, args){
  let r;
  try{
    const resp = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn:fn, args:args}), redirect:"follow"});
    r = await resp.json();
  }catch(e){ throw new Error("No hay conexión con el servidor."); }
  if(r && r.ok===false){ if(r.auth) sesionExpirada(); throw new Error(r.error || "Error"); }
  return r;
}
function apiGoogle(fn, args){
  return new Promise((resolve, reject)=>{
    google.script.run
      .withSuccessHandler(r=>{
        if(r && r.ok===false){ if(r.auth) sesionExpirada(); return reject(new Error(r.error||"Error")); }
        resolve(r);
      })
      .withFailureHandler(e=>reject(new Error((e && e.message) || "Error de conexión")))
      [fn](...args);
  });
}
function sesionExpirada(){
  TOKEN=null; ME=null; store("tj_token", null);
  renderLogin("Tu sesión expiró. Ingresa de nuevo.");
}

function iso(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }

/* ===================== NEGOCIO: días hábiles colombianos ===================== */
function isBusinessDay(dt){
  const dow = dt.getDay();
  if(dow===0||dow===6) return false;
  return !HOLIDAY_SET.has(iso(dt));
}
function addWorkdays(startIso, n){
  let dt = new Date(startIso+"T00:00:00"), count = 0;
  while(count < n){ dt.setDate(dt.getDate()+1); if(isBusinessDay(dt)) count++; }
  return dt;
}
function networkdays(fromDt, toDt){
  if(fromDt>toDt) return -networkdays(toDt,fromDt);
  let c=0; const dt=new Date(fromDt);
  while(dt<=toDt){ if(isBusinessDay(dt)) c++; dt.setDate(dt.getDate()+1); }
  return c;
}
function computeCase(c){
  const limite = addWorkdays(c.recepcion, c.termino);
  limite.setHours(0,0,0,0);
  let estado; const dias = Math.round((limite-TODAY)/86400000);
  if(c.respuesta){ estado="respondido"; }
  else if(limite < TODAY){ estado="vencido"; }
  else if(networkdays(new Date(TODAY.getTime()+86400000), limite) <= 3){ estado="proximo"; }
  else { estado="vigente"; }
  return Object.assign({}, c, {limite, dias:Math.max(dias,0), estado});
}
function casosDe(pid){ return CASOS.filter(c=>c.owner===pid); }
function computeAll(pid){ return casosDe(pid).map(computeCase); }
function counters(list){ const c={vigente:0,proximo:0,vencido:0,respondido:0}; list.forEach(x=>c[x.estado]++); return c; }
function urgentListFor(pid, list){ return list.filter(x=>x.estado!=="respondido").sort((a,b)=>a.limite-b.limite); }

async function cargar(){
  const r = await api("datos", TOKEN);
  ME = r.yo;
  PROFILES = r.usuarios.map(u=>Object.assign({}, u, {coord: u.rol==="coord"}));
  CASOS = r.casos;
  HOLIDAY_SET = new Set(r.festivos);
  TIPOS = r.tipos; DEPENDENCIAS = r.dependencias;
  const p = r.hoy.split("-"); TODAY = new Date(+p[0], +p[1]-1, +p[2]);
}
function miPerfil(){ return PROFILES.find(p=>p.id===ME.id) || {id:ME.id, nombre:ME.nombre, coord:ME.rol==="coord"}; }

/* ===================== GUARDADO AUTOMÁTICO ===================== */
const dirty = new Set(), timers = {};
let cola = Promise.resolve();
function setStatus(t, cls){ const e=document.getElementById("save-status"); if(e){ e.textContent=t; e.className="save-status "+(cls||""); } }
function programarGuardado(id){ dirty.add(id); clearTimeout(timers[id]); setStatus("Editando…",""); timers[id]=setTimeout(()=>guardarYa(id), 700); }
function guardarYa(id){
  clearTimeout(timers[id]); delete timers[id];
  cola = cola.then(async ()=>{
    if(!dirty.has(id)) return;
    const c = CASOS.find(x=>x.id===id); if(!c){ dirty.delete(id); return; }
    dirty.delete(id); setStatus("Guardando…","");
    try{
      await api("guardarCaso", TOKEN, {id:c.id, tipo:c.tipo, radicado:c.radicado, recepcion:c.recepcion, asunto:c.asunto,
        dependencia:c.dependencia, termino:c.termino, respuesta:c.respuesta, ubicacion:c.ubicacion});
      setStatus("✓ Guardado","ok");
    }catch(e){ dirty.add(id); setStatus("⚠ No se pudo guardar: "+e.message,"err"); }
  });
  return cola;
}
function guardarPendientes(){ return Promise.all([...dirty].map(id=>guardarYa(id))); }

async function refrescar(){
  if(!TOKEN) return;
  await guardarPendientes();
  try{
    const antes = JSON.stringify(CASOS);
    const tabAntes = viewTab;
    const r = await api("datos", TOKEN);
    if(viewTab==="mine" || tabAntes==="mine" || viewTab==="norma") return;      // no pisar la edición propia
    const a = document.activeElement;
    if(a && a.matches && a.matches("#vg-host input, #vg-host select")) return;   // está escribiendo un filtro: se actualiza en el próximo ciclo
    if(JSON.stringify(r.casos) !== antes){ CASOS = r.casos; PROFILES = r.usuarios.map(u=>Object.assign({}, u, {coord:u.rol==="coord"})); render(); }
  }catch(e){ /* silencioso */ }
}
setInterval(()=>{ if(TOKEN && viewTab!=="mine" && viewTab!=="norma") refrescar(); }, 60000);

    <div class="footnote">Elemento visual interactivo</div>`;
  const userI=document.getElementById("in-user"), passI=document.getElementById("in-pass"),
        err=document.getElementById("login-err"), btn=document.getElementById("btn-login");
  const fondo = document.querySelector(".fondo-vivo");
  const pesar = () => {                      // la balanza del fondo pesa lo que escribes
    if(!fondo) return;
    const u = Math.min(userI.value.length, 6) / 6, pw = Math.min(passI.value.length, 4) / 4;
    fondo.style.setProperty("--tilt", ((pw - u) * 11).toFixed(1) + "deg");
    fondo.classList.toggle("listo", userI.value.length >= 3 && passI.value.length >= 3);
  };
  userI.addEventListener("input", pesar); passI.addEventListener("input", pesar);
  async function tryLogin(){
    if(!userI.value.trim() || !passI.value){ err.textContent="Escribe tu usuario y tu clave."; return; }
    btn.disabled=true; btn.textContent="Ingresando…"; err.textContent="";
    try{
      const r = await api("login", userI.value, passI.value);
      TOKEN = r.token; store("tj_token", TOKEN);
      if(fondo && !REDUCE){ fondo.classList.add("st-ok"); await new Promise(res=>setTimeout(res, 900)); }   // el mazo golpea y la balanza se equilibra
      await cargar(); viewTab="mine"; controlSelected=null; mailMsg={t:"",ok:true}; pwMsg={t:"",ok:true};
      render();
    }catch(e){
      err.textContent=e.message; passI.value=""; btn.disabled=false; btn.textContent="Ingresar →";
      if(fondo){ fondo.classList.remove("st-ok"); fondo.classList.add("st-error"); setTimeout(()=>fondo.classList.remove("st-error"), 1300); pesar(); }
    }
  }
  btn.addEventListener("click", tryLogin);
  passI.addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
  userI.addEventListener("keydown", e=>{ if(e.key==="Enter") passI.focus(); });
  wireFondo(); wireTema();
}

/* ===================== DONUT SVG ===================== */
function donutSvg(counts){
  const total = counts.vigente+counts.proximo+counts.vencido+counts.respondido;
  const segs = [
    {n:counts.vigente, c:"var(--green)"},
    {n:counts.proximo, c:"var(--amber)"},
    {n:counts.vencido, c:"var(--red)"},
    {n:counts.respondido, c:"var(--seg-navy)"}
  ];
  const R=52, C=2*Math.PI*R;
  let acc=0, paths="";
  segs.forEach(s=>{
    const frac = total? s.n/total : 0;
    const len = frac*C;
    paths += `<circle class="donut-seg" cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="20"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;
    acc += len;
  });
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    ${total? paths : `<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"/>`}
    <text x="70" y="66" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="26" fill="var(--ink)">${total}</text>
    <text x="70" y="84" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="Manrope">casos</text>
  </svg>`;
}

/* pétalos de ocobo cayendo */
function petalos(n){
  if(REDUCE) return "";
  let h = "";
  for(let i=0;i<n;i++){
    const dur = 10 + (i*7)%9, left = (i*37+11)%100, dx = (i%2 ? 1 : -1) * (40 + (i*23)%70);
    h += `<i style="left:${left}%;animation-duration:${dur}s;animation-delay:${-((i*5)%dur)}s;--dx:${dx}px"></i>`;
  }
  return `<div class="petalos" aria-hidden="true">${h}</div>`;
}

/* números que suben hasta su valor (KPI y % de cumplimiento) */
function animarNumeros(root){
  if(REDUCE || !root) return;
  root.querySelectorAll(".kpi .val, .balanza-pct, .nm-num").forEach(el=>{
    const m = /^(\d+)(%?)$/.exec(el.textContent.trim()); if(!m) return;
    const fin = +m[1], suf = m[2], t0 = performance.now(), dur = 900;
    el.textContent = "0" + suf;
    const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(fin * e) + suf; if(k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

/* Ruta de plazos: cada actuación pendiente es un bus que avanza hacia la bandera = fecha límite */
function rutaPlazos(items, max){
  max = max || 8;
  const pend = items.filter(x=>x.estado!=="respondido").sort((a,b)=>a.limite-b.limite);
  if(!pend.length) return `<div class="ruta-vacia"><div class="rv-lane"><div class="ruta-road"></div><div class="rv-bus">${busSvg("#3D85C6",44)}</div></div><p class="rv-txt">🌸 Ruta despejada: no hay actuaciones pendientes.</p></div>`;
  const manana = new Date(TODAY.getTime() + 86400000);
  const filas = pend.slice(0, max).map(c=>{
    const desde = new Date(new Date(c.recepcion + "T00:00:00").getTime() + 86400000);
    const hechos = c.estado==="vencido" ? c.termino : Math.max(0, Math.min(c.termino, networkdays(desde, TODAY)));
    const p = Math.round(Math.min(1, hechos / Math.max(1, c.termino)) * 100);
    const rest = c.limite > TODAY ? networkdays(manana, c.limite) : 0;
    const cuando = c.estado==="vencido" ? "¡Pasó la parada! · venció " + fmt(c.limite)
      : c.limite.getTime()===TODAY.getTime() ? "Vence hoy"
      : rest + (rest===1 ? " día háb. · " : " días háb. · ") + fmt(c.limite);
    const col = c.estado==="vencido" ? "#E5483B" : c.estado==="proximo" ? "#F0A020" : "#3D85C6";
    const nombre = (c.who ? c.who + " · " : "") + (c.radicado || "sin radicado") + " — " + (c.asunto || c.tipo);
    return `<div class="ruta-row ${c.estado}">
      <div>${tipoIcono(c.tipo, 36)}</div>
      <div><div class="ruta-top"><span class="ruta-name" title="${esc(nombre)}">${esc(nombre)}</span><span class="ruta-when">${esc(cuando)}</span></div>
        <div class="ruta-lane" style="--f:${(p/100).toFixed(3)}"><div class="ruta-road"></div><div class="ruta-fill"></div><div class="ruta-bus">${busSvg(col,44)}</div>
          <div class="ruta-flag"><svg viewBox="0 0 14 24" width="14" height="24" aria-hidden="true"><path d="M2 2v21" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/><path d="M2.6 3h10l-3 4.2 3 4.2H2.6z" fill="#D6488E"/></svg></div></div></div>
    </div>`;
  }).join("");
  const mas = pend.length > max ? `<div class="ruta-mas">+ ${pend.length - max} más en la tabla</div>` : "";
  return `<div class="ruta">${filas}</div>${mas}`;
}

/* mazo + pétalos al registrar la respuesta de una actuación */
function celebrar(){
  if(REDUCE) return;
  const d = document.createElement("div");
  d.className = "celebra"; d.setAttribute("aria-hidden","true");
  let p = "";
  for(let i=0;i<16;i++){ const a = i/16*Math.PI*2, r = 70 + (i*29)%50; p += `<i style="--x:${Math.round(Math.cos(a)*r)}px;--y:${Math.round(Math.sin(a)*r-30)}px;animation-delay:${(i%4)*40}ms"></i>`; }
  d.innerHTML = `<div class="cel-burst">${p}</div>${tipoIcono("DEMANDA",64,true)}<b>¡Actuación respondida!</b><span>Un pendiente menos en la ruta.</span>`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 2700);
}

/* ===================== MODO CLARO / OSCURO ===================== */
function pref(k, v){
  try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
  catch(e){ if(v===undefined) return mem["p_"+k] || null; if(v===null) delete mem["p_"+k]; else mem["p_"+k] = v; }
}
function temaEfectivo(){
  const t = document.documentElement.dataset.theme;
  if(t==="dark" || t==="light") return t;
  return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function aplicarTema(t){ if(t==="dark" || t==="light") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function temaBtn(extra){
  return `<button type="button" class="theme-btn ${extra||""}" id="btn-theme" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro">${temaEfectivo()==="dark" ? "☀️" : "🌙"}</button>`;
}
function wireTema(){
  const b = document.getElementById("btn-theme"); if(!b) return;
  b.addEventListener("click", ()=>{
    const nuevo = temaEfectivo()==="dark" ? "light" : "dark";
    aplicarTema(nuevo); pref("tj_tema", nuevo);
    b.textContent = nuevo==="dark" ? "☀️" : "🌙";
  });
}

let FONDO_PARALAJE = false;
function wireFondo(){
  const f = document.querySelector(".fondo-vivo"); if(!f) return;
  if(!FONDO_PARALAJE && !REDUCE){
    FONDO_PARALAJE = true;
    let raf = 0;
    window.addEventListener("mousemove", e=>{
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        const el = document.querySelector(".fondo-vivo"); if(!el) return;
        el.style.setProperty("--mx", ((e.clientX / innerWidth) * 2 - 1).toFixed(3));
        el.style.setProperty("--my", ((e.clientY / innerHeight) * 2 - 1).toFixed(3));
      });
    });
  }
  f.querySelectorAll(".vbus").forEach(b=>b.addEventListener("click", ()=>{
    b.classList.remove("honk-on"); void b.getBoundingClientRect(); b.classList.add("honk-on");
    setTimeout(()=>b.classList.remove("honk-on"), 1300);
  }));
  const svg = f.querySelector(".fv"), sem = f.querySelector(".fsem");
  if(sem) sem.addEventListener("click", ()=>{ const o = ["g","a","r"]; svg.dataset.luz = o[(o.indexOf(svg.dataset.luz) + 1) % 3]; });
  const mz = f.querySelector(".mazo-fondo");
  if(mz) mz.addEventListener("click", ()=>{ mz.classList.remove("golpe"); void mz.getBoundingClientRect(); mz.classList.add("golpe"); setTimeout(()=>mz.classList.remove("golpe"), 1000); });
}

function nmChips(){

function nmFiltradas(){
  const q = vgNorm(NM.q.trim()), info = NM.tipo ? TIPO_INFO[NM.tipo] : null;
  return NORMAS.filter(n=>{
    if(NM.nivel && n.nivel!==NM.nivel) return false;
    if(info && !(info.base.includes(n.id) || n.siempre)) return false;
    if(q && !vgNorm([n.nombre, n.titulo, n.resumen, n.uso || "", n.puntos.join(" ")].join(" ")).includes(q)) return false;
    return true;
  });

function nmCard(n, i){

function renderNormativa(){

function nmActualizar(quieta){
  const lista = nmFiltradas();
  document.querySelectorAll("#nm-pir .pir-l").forEach(g=>g.classList.toggle("dim", !!NM.nivel && g.dataset.nv!==NM.nivel));
  document.querySelectorAll("#nm-chips .nm-chip").forEach(b=>b.classList.toggle("on", b.dataset.nt===NM.tipo));
  if(!quieta){ const p = document.getElementById("nm-panel"); p.innerHTML = nmPanel(); animarNumeros(p); }
  const g = document.getElementById("nm-grid");
  g.classList.toggle("quieta", !!quieta);
  g.innerHTML = lista.length ? lista.map(nmCard).join("") : `<div class="nm-vacio">Ninguna norma coincide con lo que elegiste. Prueba quitando algún filtro.</div>`;
  document.getElementById("nm-cuenta").textContent = lista.length===NORMAS.length ? NORMAS.length + " normas y reglas" : "Mostrando " + lista.length + " de " + NORMAS.length;
  document.getElementById("nm-limpiar").hidden = !(NM.tipo || NM.nivel || NM.q);
}
function wireNormativa(){
  const root = document.getElementById("body");
  nmActualizar();
  root.addEventListener("click", e=>{
    const ch = e.target.closest(".nm-chip");
    if(ch){ NM.tipo = ch.dataset.nt; NM.abierta = null; nmActualizar(); return; }
    const pl = e.target.closest(".pir-l");
    if(pl){ NM.nivel = NM.nivel===pl.dataset.nv ? "" : pl.dataset.nv; nmActualizar(); return; }
    if(e.target.closest("#nm-limpiar")){ NM.tipo = ""; NM.nivel = ""; NM.q = ""; NM.abierta = null; document.getElementById("nm-q").value = ""; nmActualizar(); return; }
    if(e.target.closest("a")) return;
    const c = e.target.closest(".nm-card");
    if(c){
      NM.abierta = NM.abierta===c.dataset.id ? null : c.dataset.id;
      root.querySelectorAll(".nm-card").forEach(k=>{
        const o = k.dataset.id===NM.abierta;
        k.classList.toggle("open", o); k.setAttribute("aria-expanded", String(o));
        k.querySelector(".pie span").textContent = o ? "Toca para cerrar" : "Toca para ver más";
      });
    }
  });
  root.addEventListener("keydown", e=>{
    if((e.key==="Enter" || e.key===" ") && (e.target.matches(".pir-l") || e.target.matches(".nm-card"))){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles:true})); }
  });
  document.getElementById("nm-q").addEventListener("input", e=>{ NM.q = e.target.value; nmActualizar(true); });
}

  });

  return `<div class="tbl-scroll"><table>
    <thead><tr>
      <th>Tipo de actuación</th><th>Radicado</th><th>Recepción</th><th>Asunto</th><th>Dependencia</th><th>Término (días)</th>
      <th>Fecha límite</th><th>Respuesta</th><th>Estado</th><th>Días rest.</th><th>Ubicación / enlace del expediente</th><th></th>
    </tr></thead>

  </table></div>
  <button class="add-row" id="add-${esc(pid)}">+ Registrar nueva actuación</button>`;
}

function wireTable(pid){
  const tbody = document.getElementById("tbody-"+pid);
  if(!tbody) return;
  function refrescarFila(tr, caso){
    const cc = computeCase(caso);
    tr.children[6].textContent = fmt(cc.limite);
    tr.children[8].innerHTML = estadoPill(cc.estado);
    tr.children[9].textContent = cc.estado==='respondido' ? '—' : cc.dias;
  }
  tbody.addEventListener("input", e=>{
    const tr = e.target.closest("tr"); if(!tr) return;
    const f = e.target.dataset.f; if(!f) return;
    const caso = CASOS.find(c=>c.id===tr.dataset.id); if(!caso || caso.owner!==ME.id) return;
    let v = e.target.value;
    if(f==="termino"){ v = Math.min(365, Math.max(1, parseInt(v||"1",10) || 1)); }
    if(f==="respuesta") v = v || null;
    if(f==="recepcion" && !v) return;
    const prev = caso[f]; caso[f] = v;
    if(f==="respuesta" && v && !prev) celebrar();
    if(f==="tipo"){ caso.termino = TERMINO_SUGERIDO[v] || caso.termino; tr.querySelector('[data-f="termino"]').value = caso.termino; }
    refrescarFila(tr, caso);
    programarGuardado(caso.id);
  });
  tbody.addEventListener("change", e=>{
    const tr = e.target.closest("tr"); if(!tr) return;
    if(e.target.dataset.f){ guardarYa(tr.dataset.id); actualizarRuta(); }
  });
  tbody.addEventListener("click", async e=>{
    const b = e.target.closest("[data-del]"); if(!b) return;
    if(!b.classList.contains("confirm")){
      b.classList.add("confirm"); b.textContent="¿Eliminar?";
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove("confirm"); b.textContent="✕"; } }, 3000);
      return;
    }
    const id = b.closest("tr").dataset.id;
    dirty.delete(id); clearTimeout(timers[id]);
    try{ await api("eliminarCaso", TOKEN, id); CASOS = CASOS.filter(c=>c.id!==id); render(); }
    catch(err){ setStatus("⚠ No se pudo eliminar: "+err.message,"err"); }
  });
  const addBtn = document.getElementById("add-"+pid);
  if(addBtn) addBtn.addEventListener("click", ()=>{
    const c = {id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,8), owner:ME.id, tipo:TIPOS[0], radicado:"",
      recepcion:iso(TODAY), asunto:"", dependencia:DEPENDENCIAS[0], termino:TERMINO_SUGERIDO[TIPOS[0]]||15, respuesta:null, ubicacion:""};
    CASOS.push(c); dirty.add(c.id); render(); guardarYa(c.id);
  });
}

/* ===================== TICKER DE URGENTES ===================== */
function urgentTicker(list, showWho){
  if(!list.length) return `<div class="empty-note">🌸 Sin pendientes urgentes por ahora.</div>`;
  return list.map(item=>{
    const cls = item.estado==="vencido" ? "crit" : item.estado==="proximo" ? "warn" : "";
    const when = item.estado==="vencido" ? "VENCIÓ · "+fmt(item.limite) : (item.dias===0?"VENCE HOY":item.dias+" días hábiles");
    return `<div class="ticker-item ${cls}">
      <div class="flag"></div>
      <div class="body">
        ${showWho?`<div class="who">${esc(item.who)} · ${esc(item.radicado)}</div>`:`<div class="who">${esc(item.radicado)} · ${esc(item.tipo)}</div>`}
        <div class="what">${esc(item.asunto)}</div>
      </div>
      <div class="when">${when}</div>
    </div>`;
  }).join("");
}

function alertBanner(cnt){
  const pendientes = cnt.vigente + cnt.proximo;
  let level, title, sub;
  if(cnt.vencido > 0){
    level="red";
    title = cnt.vencido===1 ? "Tienes 1 actuación vencida" : `Tienes ${cnt.vencido} actuaciones vencidas`;
    sub = "Requiere atención inmediata — el término legal ya se cumplió.";
  } else if(pendientes > 0){
    level="amber";
    title = "Tienes actuaciones en trámite";
    sub = `${pendientes} dentro del término (${cnt.proximo} próximas a vencer) · ${cnt.respondido} ya respondidas.`;
  } else {
    level="green";
    title = "Todo al día";
    sub = "No tienes actuaciones pendientes en este momento.";
  }
  return `<div class="alert-banner ${level}"><div class="icon">${semaforoSvg(level)}</div><div class="txt"><b>${title}</b><span>${sub}</span></div></div>`;
}

        <div class="pw-grid">
          <input type="password" id="pw-actual" placeholder="Clave actual" autocomplete="current-password"/>
          <input type="password" id="pw-nueva" placeholder="Nueva clave (mín. 6)" autocomplete="new-password"/>
          <input type="password" id="pw-rep" placeholder="Repite la nueva" autocomplete="new-password"/>
        </div>
        <button class="btn-sec" id="pw-btn">Guardar nueva clave</button>
        <div class="msg ${pwMsg.ok?'ok':'err'}" id="pw-msg">${esc(pwMsg.t)}</div>
      </div>
    </div>`;
  wireTable(profile.id);

  const mailIn=document.getElementById("mail-in"), lockBtn=document.getElementById("lock-btn"), mm=document.getElementById("mail-msg");
  lockBtn.addEventListener("click", async ()=>{
    const bloquear = !ME.bloqueado;
    const correo = (bloquear ? mailIn.value : ME.correo) || "";
    if(bloquear && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo.trim())){ mm.className="msg err"; mm.textContent="Escribe un correo válido antes de bloquearlo."; mailIn.focus(); return; }
    lockBtn.disabled=true; mm.className="msg ok"; mm.textContent = bloquear ? "Verificando y enviando confirmación…" : "Desbloqueando…";
    try{
      const r = await api("guardarCorreo", TOKEN, correo.trim(), bloquear);
      ME = r.yo;
      mailMsg = {t: bloquear ? "✓ Correo bloqueado. Te enviamos un mensaje de confirmación." : "Correo desbloqueado: puedes cambiarlo.", ok:true};
    }catch(e){ mailMsg = {t:e.message, ok:false}; }
    render();
  });

  const pwBtn=document.getElementById("pw-btn");
  pwBtn.addEventListener("click", async ()=>{
    const a=document.getElementById("pw-actual").value, n=document.getElementById("pw-nueva").value, r2=document.getElementById("pw-rep").value;
    const pm=document.getElementById("pw-msg");
    if(!a||!n){ pm.className="msg err"; pm.textContent="Completa la clave actual y la nueva."; return; }
    if(n!==r2){ pm.className="msg err"; pm.textContent="La nueva clave y su repetición no coinciden."; return; }
    pwBtn.disabled=true; pm.className="msg ok"; pm.textContent="Guardando…";
    try{ await api("cambiarClave", TOKEN, a, n); pwMsg={t:"✓ Clave actualizada.", ok:true}; }
    catch(e){ pwMsg={t:e.message, ok:false}; }
    render();
  });
}

/* ===================== VISTA GENERAL (todos, solo lectura) ===================== */
const ESTADO_TXT = {vigente:"Vigente", proximo:"Próximo a vencer", vencido:"Venció", respondido:"Respondido"};
const ESTADO_ORD = {vencido:0, proximo:1, vigente:2, respondido:3};
const VG_COLLATOR = new Intl.Collator("es", {numeric:true, sensitivity:"base"});
const VG_VACIO = {q:"", who:"", tipo:"", dependencia:"", estado:"", radicado:"", asunto:"", ubicacion:"", recepcionD:"", recepcionH:"", limiteD:"", limiteH:""};
/* el estado del filtro y del orden vive fuera del HTML: sobrevive a los refrescos automáticos */
const VG = {sort:"limite", dir:1, f:Object.assign({}, VG_VACIO)};
/* t: sel = lista desplegable, txt = texto libre, date = rango desde/hasta, none = solo ordena */
const VG_COLS = [
  {k:"who", l:"Responsable", t:"sel"}, {k:"tipo", l:"Tipo de actuación", t:"sel"}, {k:"radicado", l:"Radicado", t:"txt"},
  {k:"recepcion", l:"Recepción", t:"date", d:"recepcion"}, {k:"asunto", l:"Asunto", t:"txt"}, {k:"dependencia", l:"Dependencia", t:"sel"},
  {k:"limite", l:"Fecha límite", t:"date", d:"limite"}, {k:"estado", l:"Estado", t:"sel"}, {k:"dias", l:"Días rest.", t:"none"},
  {k:"ubicacion", l:"Ubicación / enlace del expediente", t:"txt"}
];

function vgNorm(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function vgRows(){
  return PROFILES.flatMap(p => computeAll(p.id).map(x => Object.assign({}, x, {
    who: p.nombre.replace("Jurídica ",""), limIso: iso(x.limite), dep: x.dependencia || "—",
    diasV: x.estado==="respondido" ? null : x.dias
  })));
}
function vgVal(r, k){
  switch(k){
    case "limite": return r.limIso;
    case "dias": return r.diasV;
    case "estado": return ESTADO_ORD[r.estado];
    case "dependencia": return r.dep;
    default: return r[k] || "";
  }
}
function vgCmp(k, x, y){
  if(typeof x==="number") return x - y;
  if(k==="recepcion" || k==="limite") return x<y ? -1 : x>y ? 1 : 0;   // fechas ISO: orden cronológico
  return VG_COLLATOR.compare(String(x), String(y));                     // texto sin distinguir tildes/mayúsculas, radicados en orden natural
}
function vgFiltrar(rows){
  const f = VG.f, q = vgNorm(f.q.trim());
  const has = (v, t) => !t || vgNorm(v).includes(vgNorm(t.trim()));
  const out = rows.filter(r =>
    (!q || vgNorm([r.who, r.tipo, r.radicado, r.asunto, r.dep, r.ubicacion, ESTADO_TXT[r.estado]].join(" ")).includes(q)) &&
    (!f.who || r.who===f.who) && (!f.tipo || r.tipo===f.tipo) && (!f.dependencia || r.dep===f.dependencia) && (!f.estado || r.estado===f.estado) &&
    has(r.radicado, f.radicado) && has(r.asunto, f.asunto) && has(r.ubicacion, f.ubicacion) &&
    (!f.recepcionD || r.recepcion>=f.recepcionD) && (!f.recepcionH || r.recepcion<=f.recepcionH) &&
    (!f.limiteD || r.limIso>=f.limiteD) && (!f.limiteH || r.limIso<=f.limiteH));
  out.sort((a, b) => {
    const x = vgVal(a, VG.sort), y = vgVal(b, VG.sort);
    if(x===null && y===null) return 0;
    if(x===null) return 1;                       // los respondidos (sin días restantes) van siempre al final
    if(y===null) return -1;
    const c = vgCmp(VG.sort, x, y);
    return c!==0 ? c*VG.dir : (a.limIso<b.limIso ? -1 : a.limIso>b.limIso ? 1 : 0);
  });
  return out;
}
function vgActivos(){ return Object.keys(VG.f).filter(k=>VG.f[k]).length; }
function vgConteo(n, total){
  const w = m => m + (m===1 ? " actuación" : " actuaciones");
  return n===total ? w(total) : "Mostrando " + n + " de " + w(total);
}
function vgFila(r){
  return `<tr>
    <td>${esc(r.who)}</td>
    <td><span class="tipo-cell">${tipoIcono(r.tipo, 24)}${esc(r.tipo)}</span></td>
    <td class="mono">${esc(r.radicado)}</td>
    <td class="mono">${fmt(new Date(r.recepcion+"T00:00:00"))}</td>
    <td>${esc(r.asunto)}</td>
    <td>${esc(r.dep)}</td>
    <td class="mono">${fmt(r.limite)}</td>
    <td>${estadoPill(r.estado)}</td>
    <td class="mono" style="text-align:right">${r.diasV===null?"—":r.diasV}</td>
    <td>${esc(r.ubicacion||"—")}</td>
  </tr>`;
}
function vgMarkup(){
  const all = vgRows();
  if(!all.length) return `<div class="empty-note">Sin actuaciones registradas todavía.</div>`;
  const uniq = k => [...new Set(all.map(r => k==="dependencia" ? r.dep : r[k]))].sort(VG_COLLATOR.compare).map(v=>[v,v]);
  const opciones = {who:uniq("who"), tipo:uniq("tipo"), dependencia:uniq("dependencia"),
    estado:Object.keys(ESTADO_ORD).map(e=>[e, ESTADO_TXT[e]])};
  Object.keys(opciones).forEach(k=>{ if(VG.f[k] && !opciones[k].some(o=>o[0]===VG.f[k])) VG.f[k] = ""; });   // el dato ya no existe: no dejar un filtro invisible
  const inp = (k, ph, aria) => `<input type="search" data-vf="${k}" placeholder="${ph}" aria-label="${aria}" value="${esc(VG.f[k])}" class="${VG.f[k]?"act":""}"/>`;
  const filtro = c => {
    if(c.t==="sel") return `<select data-vf="${c.k}" aria-label="Filtrar por ${esc(c.l)}" class="${VG.f[c.k]?"act":""}"><option value="">Todos</option>${opciones[c.k].map(([v,t])=>`<option value="${esc(v)}" ${VG.f[c.k]===v?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
    if(c.t==="txt") return inp(c.k, "Filtrar…", "Filtrar por "+esc(c.l));
    if(c.t==="date"){
      const d = c.d+"D", h = c.d+"H";
      return `<div class="vg-dates"><label><span>Desde</span><input type="date" data-vf="${d}" aria-label="${esc(c.l)} desde" value="${esc(VG.f[d])}" class="${VG.f[d]?"act":""}"/></label>
        <label><span>Hasta</span><input type="date" data-vf="${h}" aria-label="${esc(c.l)} hasta" value="${esc(VG.f[h])}" class="${VG.f[h]?"act":""}"/></label></div>`;
    }
    return "";
  };
  return `<div class="vg-toolbar">
      <input type="search" data-vf="q" id="vg-q" placeholder="🔍 Buscar en toda la tabla…" aria-label="Buscar en toda la tabla" value="${esc(VG.f.q)}" class="${VG.f.q?"act":""}"/>
      <span class="vg-count" id="vg-count"></span>
      <button type="button" class="vg-clear" id="vg-clear" hidden>✕ Limpiar filtros</button>
    </div>
    <div class="tbl-scroll"><table>
      <thead>
        <tr>${VG_COLS.map(c=>`<th class="vg-th" data-vs="${c.k}" tabindex="0" role="button" title="Ordenar por ${esc(c.l)}">${esc(c.l)}<span class="ar">↕</span></th>`).join("")}</tr>
        <tr class="vg-filters">${VG_COLS.map(c=>`<th>${filtro(c)}</th>`).join("")}</tr>
      </thead>
      <tbody></tbody>
    </table></div>`;
}
/* repinta solo filas, contador y flechas: los cuadros de filtro no se tocan, así no se pierde el cursor al escribir */
function vgActualizar(){
  const host = document.getElementById("vg-host");
  const tbody = host && host.querySelector("tbody"); if(!tbody) return;
  const all = vgRows(), list = vgFiltrar(all);
  tbody.innerHTML = list.length ? list.map(vgFila).join("") : `<tr><td colspan="${VG_COLS.length}" class="empty-row">Ninguna actuación coincide con los filtros elegidos.</td></tr>`;
  host.querySelector("#vg-count").textContent = vgConteo(list.length, all.length);
  host.querySelector("#vg-clear").hidden = !vgActivos();
  host.querySelectorAll("th[data-vs]").forEach(th=>{
    const on = th.dataset.vs===VG.sort;
    th.classList.toggle("on", on);
    th.setAttribute("aria-sort", on ? (VG.dir>0 ? "ascending" : "descending") : "none");
    th.querySelector(".ar").textContent = on ? (VG.dir>0 ? "▲" : "▼") : "↕";
  });
  host.querySelectorAll("[data-vf]").forEach(i=>i.classList.toggle("act", !!VG.f[i.dataset.vf]));
}
function wireVistaGeneral(){
  const host = document.getElementById("vg-host"); if(!host) return;
  host.innerHTML = vgMarkup();
  vgActualizar();
  const onFiltro = e => { const k = e.target.dataset && e.target.dataset.vf; if(!k) return; VG.f[k] = e.target.value; vgActualizar(); };
  host.addEventListener("input", onFiltro);
  host.addEventListener("change", onFiltro);
  const ordenar = th => { const k = th.dataset.vs; if(VG.sort===k) VG.dir = -VG.dir; else { VG.sort = k; VG.dir = 1; } vgActualizar(); };
  host.addEventListener("click", e=>{
    if(e.target.closest("#vg-clear")){ VG.f = Object.assign({}, VG_VACIO); host.innerHTML = vgMarkup(); vgActualizar(); return; }
    const th = e.target.closest("th[data-vs]"); if(th) ordenar(th);
  });
  host.addEventListener("keydown", e=>{
    if((e.key==="Enter" || e.key===" ") && e.target.matches("th[data-vs]")){ e.preventDefault(); ordenar(e.target); }
  });
}
function renderVistaGeneral(){
  const todos = PROFILES.flatMap(p => computeAll(p.id).map(x => Object.assign({who:p.nombre.replace("Jurídica ","")}, x)));
  return `<div class="card">
    <h2>🚌 Ruta de plazos del equipo <span class="n">las más urgentes</span></h2>
    ${RUTA_AYUDA}
    ${rutaPlazos(todos, 8)}
  </div>
  <div class="card" style="margin-top:16px">
    <h2>🗂️ Vista general del área jurídica <span class="readonly-note">🔒 Solo lectura</span></h2>
    <p class="vg-tip">Procesos de los 6 perfiles. Haz clic en el título de una columna para ordenarla (de menor a mayor o al revés; en fechas, de la más antigua a la más reciente) y usa los filtros de abajo para ver solo lo que buscas. Cada quien edita únicamente su propia mesa de casos, en "Mis procesos".</p>
    <div id="vg-host"></div>
  </div>`;
}

/* ===================== CONTROL OPERATIVO (Nadya: analisis profundo por profesional) ===================== */
function responseDays(c){
  const from = new Date(c.recepcion+"T00:00:00"); from.setDate(from.getDate()+1);
  const to = new Date(c.respuesta+"T00:00:00");
  return to < from ? 0 : networkdays(from, to);
}
/* promedio de dias habiles de respuesta, agrupado por tipo de actuacion (solo casos respondidos) */
function avgByTipo(list){
  const acc = {};
  list.filter(x=>x.respuesta).forEach(x=>{ (acc[x.tipo] = acc[x.tipo] || []).push(responseDays(x)); });
  const out = {};
  Object.keys(acc).forEach(t=>{ out[t] = {avg: acc[t].reduce((a,b)=>a+b,0)/acc[t].length, n: acc[t].length}; });
  return out;
}
function cmpRowsByTipo(list, teamList){
  const mine = avgByTipo(list), team = avgByTipo(teamList);
  const tipos = [...new Set(list.map(x=>x.tipo))];
  if(!tipos.length) return `<div class="empty-note">Aún no tiene actuaciones registradas.</div>`;
  return tipos.map(t=>{
    const m = mine[t], g = team[t];
    const max = Math.max(m?m.avg:0, g?g.avg:0, 1);
    return `<div class="cmp">
      <div class="cmp-lbl"><span>${esc(t)}</span><span>${m? m.avg.toFixed(1)+' d. háb.'+(m.n>1?' ('+m.n+' casos)':''):'Sin respondidas aún'} · Equipo ${g? g.avg.toFixed(1)+' d. háb.'+(g.n>1?' ('+g.n+' casos)':''):'—'}</span></div>
      <div class="cmp-bar"><i class="sel" style="width:${m?(m.avg/max*100):0}%"></i></div>
      <div class="cmp-bar" style="margin-top:4px"><i class="team" style="width:${g?(g.avg/max*100):0}%"></i></div>
    </div>`;
  }).join("");
}
function renderControlOperativo(bodyEl){
  const staff = PROFILES.filter(p=>!p.coord);
  if(!controlSelected || !staff.find(p=>p.id===controlSelected)) controlSelected = staff[0].id;
  const sel = staff.find(p=>p.id===controlSelected);
  const list = computeAll(sel.id);
  const cnt = counters(list);
  const total = list.length;
  const pctCumpl = total? (total-cnt.vencido)/total : 1;
  const urgentes = urgentListFor(sel.id, list);

  const teamList = staff.flatMap(p=>computeAll(p.id));
  const teamTotal = teamList.length;
  const teamCnt = counters(teamList);
  const pctTeam = teamTotal? (teamTotal-teamCnt.vencido)/teamTotal : 1;

  bodyEl.innerHTML = `
    <div class="card">
      <div class="selector-row">
        <label>👤 Profesional:</label>
        <select id="ctrl-select">${staff.map(p=>`<option value="${p.id}" ${p.id===sel.id?'selected':''}>${esc(p.nombre.replace('Jurídica ',''))}</option>`).join("")}</select>
      </div>
    </div>
    ${alertBanner(cnt)}
    <div class="kpis">
      <div class="kpi navy"><div class="lbl">Total</div><div class="val">${total}</div></div>
      <div class="kpi green"><div class="lbl">Vigentes</div><div class="val">${cnt.vigente}</div></div>
      <div class="kpi amber"><div class="lbl">Próx. a vencer</div><div class="val">${cnt.proximo}</div></div>
      <div class="kpi red"><div class="lbl">Vencidos</div><div class="val">${cnt.vencido}</div></div>
      <div class="kpi blue"><div class="lbl">Respondidos</div><div class="val">${cnt.respondido}</div></div>
      <div class="kpi ocobo"><div class="lbl">% Cumpl.</div><div class="val">${Math.round(pctCumpl*100)}%</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>🚌 Ruta de plazos de ${esc(sel.nombre.replace('Jurídica ',''))}</h2>
      ${RUTA_AYUDA}
      ${rutaPlazos(list)}
    </div>
    <div class="grid">
      <div class="card">
        <h2>⏱️ Tiempo de respuesta por tipo de proceso</h2>
        <p style="color:var(--ink-soft); font-size:.8rem; margin:-4px 0 14px;">Promedio de días hábiles que tarda en responder cada tipo de actuación, comparado con el promedio del equipo para ese mismo tipo.</p>
        ${cmpRowsByTipo(list, teamList)}
        <h2 style="margin-top:18px">✅ Cumplimiento general</h2>
        <div class="cmp">
          <div class="cmp-lbl"><span>% Cumplimiento</span><span>${Math.round(pctCumpl*100)}% · Equipo ${Math.round(pctTeam*100)}%</span></div>
          <div class="cmp-bar"><i class="sel" style="width:${Math.round(pctCumpl*100)}%"></i></div>
          <div class="cmp-bar" style="margin-top:4px"><i class="team" style="width:${Math.round(pctTeam*100)}%"></i></div>
        </div>
        <div class="cmp-legend"><span><i style="background:var(--bar-sel)"></i>${esc(sel.nombre.replace('Jurídica ',''))}</span><span><i style="background:var(--ocobo)"></i>Equipo (5 profesionales)</span></div>
      </div>
      <div class="card">
        <h2>⚖️ Balanza de cumplimiento</h2>
        ${balanzaSvg(pctCumpl, sel.nombre.replace('Jurídica ',''))}
      </div>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="card">
        <h2>📊 Distribución por estado</h2>
        <div class="donut-wrap">${donutSvg(cnt)}
          <div class="legend">
            <div class="row"><span class="dot" style="background:var(--green)"></span>Vigente — ${cnt.vigente}</div>
            <div class="row"><span class="dot" style="background:var(--amber)"></span>Próximo — ${cnt.proximo}</div>
            <div class="row"><span class="dot" style="background:var(--red)"></span>Vencido — ${cnt.vencido}</div>
            <div class="row"><span class="dot" style="background:var(--seg-navy)"></span>Respondido — ${cnt.respondido}</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>🚨 Pendientes de ${esc(sel.nombre.replace('Jurídica ',''))}</h2>
        ${urgentTicker(urgentes, false)}
      </div>
    </div>
  `;
  document.getElementById("ctrl-select").addEventListener("change", e=>{ controlSelected = e.target.value; render(); });
}

  aplicarTema(pref("tj_tema"));
  document.getElementById("app").innerHTML = `<div class="loading"><div class="spin"></div>Cargando Terminal Jurídica…</div>`;
  TOKEN = store("tj_token");
  if(TOKEN){
    try{ await cargar(); render(); return; }
    catch(e){ TOKEN=null; store("tj_token", null); }
  }
  renderLogin();
}
boot();
})();
