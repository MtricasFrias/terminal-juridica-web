<style>
:root{
  /* paleta real del SETP (la misma de los tableros institucionales: TransMusical SETP + Alcaldía) */
  --navy:#0B1F5C; --navy-2:#123a7a; --navy-deep:#071444; --blue:#159BD6; --blue-soft:#E6F4FB;
  --ocobo:#D62828; --ocobo-soft:#FBE6E6; --gold:#F0A800; --gold-soft:#FEF3DE;
  --cream:#EEF2F9; --paper:#FFFFFF; --ink:#0D1730; --ink-soft:#5B6A88; --line:#E0E6F1;
  --green:#00A830; --green-bg:#E4F6EA; --amber:#B9821C; --amber-bg:#FEF3DE; --red:#D62828; --red-bg:#FBE6E6;
  --shadow: 0 6px 20px rgba(11,31,92,.08), 0 20px 44px -20px rgba(11,31,92,.28);
  color-scheme:light;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0; height:100%; background:var(--navy); overflow:hidden;}
body{font-family:'Public Sans',system-ui,sans-serif; color:var(--ink);}
h1,h2,h3{font-family:'Barlow',sans-serif; font-weight:800; letter-spacing:-.01em; margin:0; text-wrap:balance;}
.mono{font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.logo-lockup{display:inline-flex; align-items:center; align-self:flex-start; background:#fff; border-radius:12px; padding:5px 10px; box-shadow:0 6px 16px rgba(0,0,0,.28); flex:none; position:relative; z-index:1;}
.logo-lockup img{height:32px; display:block;}
.foto-marca{position:absolute; inset:0; z-index:-1; overflow:hidden;}
.foto-marca img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.05);}
.foto-marca::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,20,68,.82) 0%, rgba(11,31,92,.86) 55%, rgba(11,31,92,.96) 100%);}
button{font-family:inherit; cursor:pointer;}
#deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
.slide{position:absolute; inset:0; display:flex; flex-direction:column; padding:6.5vh 6.5vw 10.5vh; opacity:0; pointer-events:none; transition:opacity .5s ease; background:var(--cream); color:var(--ink);}
.slide.activa{opacity:1; pointer-events:auto; z-index:1;}
.slide:not(.activa) *{animation-play-state:paused!important;}      /* las diapositivas que no se ven no gastan animación (había ~35 corriendo escondidas) */
.slide.navy{background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%); color:var(--cream);}
.slide.cream2{background:linear-gradient(160deg, var(--cream) 0%, #ECE6D8 100%);}

/* -------- entrada escalonada: pausada hasta que la diapositiva esté activa -------- */
.entra{animation: entraKF .65s cubic-bezier(.2,.8,.2,1) both; animation-play-state:paused;}
.slide.activa .entra{animation-play-state:running;}
@keyframes entraKF{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
.flota{animation:flotarKF 3.6s ease-in-out infinite;}
@keyframes flotarKF{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }
.gira-lento{animation:giraKF 22s linear infinite;}
@keyframes giraKF{ to{transform:rotate(360deg);} }
.pulso-dot{animation:pulsoKF 1.4s ease-in-out infinite;}
@keyframes pulsoKF{ 0%,100%{opacity:.4; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }
@keyframes dibujar{ to{stroke-dashoffset:0;} }
.linea-dibujo{stroke-dasharray:400; stroke-dashoffset:400; animation:dibujar 1.6s ease forwards; animation-play-state:paused;}
.slide.activa .linea-dibujo{animation-play-state:running;}
@keyframes balancearKF{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
.balancea{animation:balancearKF 4.2s ease-in-out infinite; transform-origin:50% 8%;}
@keyframes petaloCaer{ from{transform:translateY(-10vh) rotate(0deg); opacity:0;} 10%{opacity:.7;} to{transform:translateY(110vh) rotate(340deg); opacity:0;} }
.petalos-fondo{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.petalos-fondo span{position:absolute; top:0; width:9px; height:9px; border-radius:60% 0; background:var(--ocobo); opacity:.55; animation:petaloCaer linear infinite;}
.escena-viva{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
@keyframes meceKF{ 0%,100%{transform:rotate(-2.2deg);} 50%{transform:rotate(2.2deg);} }
.grid{display:grid; gap:1.4vw;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);}
.split{display:grid; grid-template-columns:1.05fr .95fr; gap:3vw; align-items:center; flex:1; min-height:0;}
.split .ilustra{display:flex; align-items:center; justify-content:center; height:100%;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.6vw 1.8vw;}
.navy .card{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16); backdrop-filter:blur(2px);}
.tabla{width:100%; border-collapse:collapse; font-size:clamp(13px,1.1vw,16px);}
.tabla th{text-align:left; background:var(--navy); color:#fff; padding:1.1vh 1.1vw; font-size:clamp(11px,.85vw,13px); text-transform:uppercase; letter-spacing:.04em;}
.tabla th:first-child{border-radius:10px 0 0 0;} .tabla th:last-child{border-radius:0 10px 0 0;}
.tabla td{padding:1.1vh 1.1vw; border-bottom:1px solid var(--line); background:var(--paper); vertical-align:top;}
.tabla tr:last-child td{border-bottom:none;}
.contraste{display:grid; grid-template-columns:1fr 1fr; gap:1.4vw;}
.contraste .box{border-radius:16px; padding:1.6vw; box-shadow:var(--shadow); display:flex; gap:12px;}
.contraste .no{background:var(--red-bg); border:2px solid var(--red);}
.contraste .si{background:var(--green-bg); border:2px solid var(--green);}
.contraste .tag{font-weight:800; font-size:clamp(12px,1vw,15px); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.7vh; display:block;}
.contraste .no .tag{color:var(--red);} .contraste .si .tag{color:var(--green);}
.contraste blockquote{margin:0; font-size:clamp(12px,1.1vw,17px); line-height:1.5; font-style:italic; color:var(--ink);}
.timeline-v{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1vh; position:relative;}
.timeline-v::before{content:""; position:absolute; left:17px; top:8px; bottom:8px; width:2px; background:var(--line);}
.navy .timeline-v::before{background:rgba(255,255,255,.2);}
.timeline-v li{display:flex; gap:1vw; align-items:flex-start; font-size:clamp(12px,1.15vw,18px); line-height:1.42; position:relative;}
.timeline-v b.n{flex:none; width:2.1vw; height:2.1vw; min-width:30px; min-height:30px; border-radius:50%; background:var(--navy); color:#fff; font-family:'Barlow',sans-serif; display:flex; align-items:center; justify-content:center; font-size:clamp(12px,1.05vw,16px); z-index:1; box-shadow:0 0 0 5px var(--cream);}
.navy .timeline-v b.n{box-shadow:0 0 0 5px var(--navy-2); background:var(--ocobo);}
.chips-fuente{display:flex; flex-wrap:wrap; gap:.6vw; margin-top:1.2vh;}
.chip-fte{background:var(--gold-soft); color:#6b4d15; font-size:clamp(10px,.85vw,12px); font-weight:700; padding:4px 12px; border-radius:999px;}
.qr-box{display:flex; align-items:center; justify-content:center; gap:3vw; flex:1;}
.qr-box img{width:min(27vw,290px); height:min(27vw,290px); border-radius:18px; box-shadow:var(--shadow); background:#fff; padding:14px;}
.qr-tx{max-width:34vw;}
.qr-tx h2{color:var(--cream); font-size:clamp(24px,2.8vw,42px); margin-bottom:1.6vh;}
.qr-tx p{font-size:clamp(13px,1.2vw,18px); color:var(--blue-soft); line-height:1.5;}
.qr-tx .link{font-family:'IBM Plex Mono',monospace; font-size:clamp(11px,1vw,14px); color:var(--cream); background:rgba(255,255,255,.1); padding:8px 14px; border-radius:8px; display:inline-block; margin-top:1.6vh; word-break:break-all;}
@keyframes mhTwinkle{0%,100%{opacity:.45; transform:scale(.85);} 50%{opacity:1; transform:scale(1.1);}}
@keyframes mhSube{from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);}}
.badge-tema{display:flex; flex-wrap:wrap; gap:.6vw; margin-top:1.4vh;}
.badge-tema span{background:rgba(255,255,255,.14); color:var(--cream); font-size:clamp(10px,.9vw,13px); font-weight:700; padding:5px 14px; border-radius:999px;}
.nav{position:fixed; left:0; right:0; bottom:0; height:60px; display:flex; align-items:center; justify-content:center; gap:14px; background:rgba(1,39,75,.92); backdrop-filter:blur(6px); z-index:50; opacity:0; transition:opacity .3s;}
#deck:hover .nav, .nav.despierto{opacity:1;}
.nav button{background:rgba(255,255,255,.14); color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center;}
.nav button:hover{background:rgba(255,255,255,.26);}
.nav button:disabled{opacity:.3; cursor:default;}
.nav .cont-n{color:#fff; font-family:'IBM Plex Mono',monospace; font-size:13px; min-width:64px; text-align:center;}
.progreso{position:fixed; left:0; top:0; height:4px; background:var(--ocobo); z-index:60; transition:width .35s ease;}
.speech{position:relative; background:var(--paper); border-radius:14px; padding:12px 16px; font-size:clamp(11px,1.05vw,15px); font-style:italic; box-shadow:var(--shadow); flex:1;}
.speech::after{content:""; position:absolute; left:22px; bottom:-9px; border:9px solid transparent; border-top-color:var(--paper);}
.avatar-mini{width:44px; height:44px; border-radius:50%; flex:none; box-shadow:var(--shadow);}
@media (max-width:900px){
  .g2,.g3,.contraste{grid-template-columns:1fr;}
  .split{grid-template-columns:1fr; gap:1.2vh;}
  .split .ilustra{order:-1; max-height:22vh;}
  .qr-box{flex-direction:column; gap:4vh;}
  .qr-tx{max-width:none; text-align:center;}
  .qr-box img{width:min(56vw,260px); height:min(56vw,260px);}
}
/* ===== panel del anfitrión: pantalla de información de la parada (sala de espera -> ruta del reto -> podio) ===== */
:root{--ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);}
#mini-host.mh-panel{position:relative; z-index:3; flex:1.3; display:flex; flex-direction:column; min-height:0; background:rgba(246,248,253,.97); color:var(--ink); padding:clamp(14px,1.5vw,28px) clamp(16px,1.8vw,32px); border:0; border-radius:18px; box-shadow:0 22px 44px -18px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.2);}
.mh-sec{display:flex; flex-direction:column; min-height:0; flex:1;}
.mh-t{margin:0; font-family:Barlow,sans-serif; font-weight:800; font-size:clamp(17px,1.75vw,40px); letter-spacing:-.005em; line-height:1.05; color:var(--navy);}
.mh-p{margin:.8vh 0 1.4vh; font-size:clamp(12px,1.05vw,24px); line-height:1.45; color:var(--ink-soft); max-width:46ch;}
.mh-sub{margin-top:.5vh; font-size:clamp(11px,1vw,23px); font-weight:600; color:var(--ink-soft); line-height:1.3; min-height:1.3em;}

.mh-contador i{font-style:normal; font-family:Barlow,sans-serif; font-weight:800; font-size:clamp(34px,4.4vw,104px); line-height:.85; color:#1767B8; font-variant-numeric:tabular-nums; display:inline-block; transition:transform .28s var(--ease-out);}
.mh-contador i.sube{transform:translateY(-6%) scale(1.12);}
.mh-contador small{font-size:clamp(10px,.9vw,15px); font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
.mh-pin{width:100%; border:1.5px solid #C9D4E8; border-radius:12px; padding:clamp(10px,1.2vh,16px); margin-bottom:10px; font-size:clamp(22px,2.4vw,40px); letter-spacing:.5em; text-align:center; background:#fff; color:var(--navy); font-family:'IBM Plex Mono',monospace;}
.mh-pin:focus{outline:none; border-color:#1767B8; box-shadow:0 0 0 3px rgba(23,103,184,.2);}
.mh-err{color:var(--red); font-size:clamp(11px,.9vw,14px); min-height:1.2em; margin-top:6px; font-weight:700;}
.mh-btn{width:100%; border:0; border-radius:12px; padding:clamp(11px,1.5vh,17px); font-family:Barlow,sans-serif; font-weight:800; font-size:clamp(14px,1.3vw,30px); letter-spacing:.01em; color:#fff; display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .16s var(--ease-out), background-color .2s ease, opacity .2s ease;}
.mh-btn:active{transform:scale(.97);}
.mh-btn:disabled{opacity:.55; cursor:default;}
.mh-btn-navy{background:var(--navy);} .mh-btn-verde{background:#00A22E; margin-top:1.2vh;}
.mh-btn-soft{background:#E9EEF8; color:#33466F; font-size:clamp(12px,1vw,16px); padding:clamp(9px,1.1vh,13px); margin-top:1vh;}
@media (hover:hover) and (pointer:fine){.mh-btn-navy:hover{background:#17306F;} .mh-btn-verde:hover{background:#00B434;} .mh-btn-soft:hover{background:#DCE4F4;}}
.mh-roster{display:flex; flex-wrap:wrap; align-content:flex-start; align-items:flex-start; gap:clamp(6px,.6vw,10px); margin:1.4vh 0 1vh; min-height:34px; overflow:auto; flex:1; scrollbar-width:thin; scrollbar-color:#B7C4DE transparent; padding-right:4px;}
.mh-chip{display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #D5DEEE; border-radius:999px; padding:4px 14px 4px 4px; font-size:clamp(11px,1.02vw,24px); font-weight:700; color:var(--navy); box-shadow:0 1px 2px rgba(11,31,92,.08);}
.mh-vacio{color:#7C8CAB; font-size:clamp(12px,1.05vw,17px); font-weight:600; align-self:center; margin:auto; text-align:center; max-width:30ch; line-height:1.4;}
/* ruta del reto: 10 paradas y la terminal (el podio); el bus avanza con cada pregunta */
.mh-ruta{margin:.4vh 0 1vh; padding:0 4px;}
.rt-linea{position:relative; height:clamp(34px,3.3vw,50px);}
.rt-base,.rt-prog{position:absolute; left:calc(.5 / 11 * 100%); right:calc(.5 / 11 * 100%); top:62%; height:5px; border-radius:3px;}

.rt-fin svg{width:68%; height:68%;}

.rt-txt{display:flex; justify-content:space-between; align-items:baseline; font-size:clamp(10px,.88vw,19px); color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
.rt-txt b{color:var(--navy); font-family:Barlow,sans-serif; font-size:clamp(13px,1.15vw,27px); letter-spacing:0; text-transform:none;}
.mh-anillo{position:relative; width:clamp(58px,5.4vw,92px); height:clamp(58px,5.4vw,92px); flex:none;}
.mh-podio{display:flex; align-items:flex-end; justify-content:center; gap:clamp(6px,.7vw,12px); flex:1; min-height:0; width:100%;}
.mh-curso .mh-btn{margin-top:1vh;}
@media (prefers-reduced-motion:reduce){.rt-prog,.rt-bus,.rt-p,.mh-contador i{transition:none;}}
.mh-ruta.llego .rt-fin{border:3px solid #F6B91D; box-shadow:none;}

.mh-roster:empty::before{content:"Esperando a que llegue la primera persona…"; color:#7C8CAB; font-size:clamp(12px,1.05vw,17px); font-weight:600; margin:auto; align-self:center; text-align:center; max-width:28ch; line-height:1.4;}

</style>
<style>
/* ===================== LA RUTA DEL SETP: presentación interactiva (calle del SETP de día) ===================== */
:root{
  --s-navy:#0B1F5C; --s-blue:#2A5BA0; --s-yellow:#F2B418; --s-yellow-d:#8A5F00; --s-pink:#0B1F5C; --s-green:#2E8B57; --s-red:#B83A2E;
  --s-ink:#0D1730; --s-mut:#44547A; --s-line:#D3DEEF; --s-paper:#fff;
  --t10:#3E6BAE; --t15:#254A8C; --t30:#0B1F5C;
  --ease:cubic-bezier(.23,1,.32,1);
  --f-cond:'Barlow Condensed','Barlow',sans-serif;
}
.progreso{display:none;}
.nav{background:rgba(11,31,92,.94); backdrop-filter:none; transition:opacity .3s; z-index:60;}
.nav:not(.despierto){pointer-events:none;}

/* ---------- el mundo: cielo, ciudad, avenida, acera y calle (la misma calle de la diapositiva del reto) ---------- */
#mundo{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:linear-gradient(180deg,#EEF2F8 0%,#E3EAF4 55%,#D2DDEC 100%);}
.mu-sol,.mu-nube{display:none;}
.mu-sol{position:absolute; top:5vh; left:46vw; width:4.4vw; height:4.4vw; min-width:40px; min-height:40px; border-radius:50%; background:#FFF1B8; border:.5vw solid rgba(255,255,255,.55);}
.mu-nube{position:absolute; left:0; will-change:transform; animation:muNube linear infinite; opacity:.92;}
.mu-nube svg{display:block; width:100%; height:auto;}
@keyframes muNube{from{transform:translateX(-26vw);} to{transform:translateX(126vw);}}
.mu-ciudad{position:absolute; left:0; right:0; top:50vh; height:30vh; width:100%; display:block;}
.mu-av{position:absolute; left:0; right:0; top:74.2vh; height:5vh; background:linear-gradient(180deg,#7C889D,#6B778C); border-top:.4vh solid #AEB9CB;}
.mu-av i{position:absolute; left:0; right:0; top:2.3vh; border-top:2px dashed rgba(255,255,255,.55);}
.mu-acera{position:absolute; left:0; right:0; top:79.2vh; height:6.4vh; background:linear-gradient(180deg,#D5DCE8,#C3CDDB); border-top:.4vh solid #EEF2F8;}
.mu-acera::after{content:""; position:absolute; left:0; right:0; bottom:-.8vh; height:.8vh; background:#E2B13A;}
.mu-calle{position:absolute; left:0; right:0; top:86.4vh; bottom:0; background:linear-gradient(180deg,#56627A,#444F66);}
.mu-calle i{position:absolute; left:0; right:0; top:7vh; border-top:3px dashed rgba(255,255,255,.4);}
.mu-veh{position:absolute; left:0; will-change:transform; animation:muPasa linear infinite;}
.mu-veh svg{display:block; width:100%; height:auto;}
.mu-veh.izq{animation-name:muPasaIzq;}
.mu-veh.izq svg{transform:scaleX(-1);}
@keyframes muPasa{from{transform:translateX(-16vw);} to{transform:translateX(112vw);}}
@keyframes muPasaIzq{from{transform:translateX(112vw);} to{transform:translateX(-16vw);}}
body.en-quiz #mundo *{animation-play-state:paused !important;}

/* ---------- estación (diapositiva de contenido) ---------- */
.slide.m{padding:0; display:block; background:transparent; color:var(--s-navy);}
.m-top{position:absolute; left:3vw; right:3vw; top:3vh; height:12vh; display:flex; gap:1.2vw; align-items:stretch;}
.m-mapa{flex:none; display:flex; align-items:center; gap:.8vw; padding:0 1.6vw; background:var(--s-yellow); color:var(--s-navy); border:0; border-radius:1.2vw; font:700 clamp(18px,1.9vw,40px)/1 var(--f-cond); letter-spacing:.06em; text-transform:uppercase; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.45); transition:transform .16s var(--ease), background-color .2s; }
.m-mapa:active{transform:scale(.97);}
@media (hover:hover){.m-mapa:hover{background:#FFC93C;}}
.m-mapa svg{width:2.6vw; height:2.6vw; min-width:24px; min-height:24px;}
.m-plate{flex:1; min-width:0; display:flex; align-items:center; gap:1.4vw; padding:0 1.8vw; background:var(--s-navy); color:#fff; border-radius:1.2vw; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.5);}
.m-badge{flex:none; width:7.6vh; height:7.6vh; border-radius:50%; display:grid; place-items:center; background:var(--rc,#fff); color:var(--rt,var(--s-navy)); font:700 clamp(26px,3.6vh,60px)/1 var(--f-cond);}
.m-plate h2{flex:1; min-width:0; margin:0; font:700 clamp(30px,4.4vw,96px)/1 var(--f-cond); letter-spacing:0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.m-ruta{flex:none; font:600 clamp(14px,1.45vw,30px)/1 var(--f-cond); letter-spacing:.08em; text-transform:uppercase; color:#BFD6F5;}
.m-body{position:absolute; left:3vw; right:3vw; top:17.5vh; bottom:30vh; display:flex; flex-direction:column; gap:2.4vh; min-height:0;}

.card2{background:var(--s-paper); border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); padding:2.4vh 1.8vw;}
.btn2{display:inline-flex; align-items:center; justify-content:center; gap:.7vw; border:0; border-radius:1.1vw; padding:1.5vh 1.8vw; background:var(--s-blue); color:#fff; font:700 clamp(17px,1.8vw,38px)/1.05 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; transition:transform .16s var(--ease), background-color .2s, box-shadow .2s; }
.btn2:active{transform:scale(.97);}
@media (hover:hover){.btn2:hover{background:#2278CC;}}
.btn2.y{background:var(--s-yellow); color:var(--s-navy);}
@media (hover:hover){.btn2.y:hover{background:#FFC93C;}}
.btn2.n{background:var(--s-navy);}
.btn2.g{background:#fff; color:var(--s-navy); box-shadow:inset 0 0 0 .3vh var(--s-line);}
button:focus-visible,[tabindex]:focus-visible{outline:.45vh solid var(--s-yellow); outline-offset:.4vh;}

/* ---------- la pantalla del bus (consejo de SETPI) y el botón de siguiente parada ---------- */
#hud{position:fixed; left:0; right:0; bottom:0; height:0; z-index:25; pointer-events:none; opacity:0; transition:opacity .35s;}
body.en-m #hud{opacity:1;}
.hud-led{position:fixed; left:3vw; width:60vw; bottom:3vh; height:11vh; display:flex; align-items:center; gap:1.2vw; padding:0 1.4vw; background:#0B1F5C; border:.5vh solid #1E3470; border-radius:1.2vw; pointer-events:auto;}
.hud-n{flex:none; width:6.4vh; height:6.4vh; border-radius:50%; display:grid; place-items:center; background:var(--s-yellow); color:var(--s-navy); font:700 clamp(20px,3.4vh,44px)/1 var(--f-cond);}
.hud-t{flex:1; min-width:0; margin:0; color:#fff; font:600 clamp(18px,2.15vw,46px)/1.15 var(--f-cond); letter-spacing:.02em; transition:opacity .25s var(--ease), transform .25s var(--ease);}
.hud-t.cambia{opacity:0; transform:translateY(.8vh);}
.hud-sig{position:fixed; left:65vw; width:19vw; bottom:3vh; height:11vh; pointer-events:auto; border:0; border-radius:1.2vw; background:var(--s-yellow); color:var(--s-navy); font:700 clamp(17px,1.9vw,40px)/1.05 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; transition:transform .16s var(--ease), background-color .2s;}
.hud-sig:active{transform:scale(.97);}
@media (hover:hover){.hud-sig:hover{background:#FFC93C;}}
#guia-stage{position:fixed; inset:0; z-index:30; pointer-events:none; overflow:visible;}
#guia-stage .sp-cv{pointer-events:none;}
body.en-quiz #guia-stage, body.en-quiz #hud{display:none;}

/* ---------- portada ---------- */
.slide.cv2{padding:0; display:grid; grid-template-columns:56vw minmax(0,1fr); background:var(--s-navy); color:#fff;}
.cv2-izq{position:relative; display:flex; flex-direction:column; min-height:0; z-index:2;}
.cv2-cab{display:flex; align-items:center; gap:2vw; height:13vh; padding:0 3vw; background:var(--s-yellow); color:var(--s-navy); font:700 clamp(17px,1.9vw,40px)/1.1 var(--f-cond); letter-spacing:.08em; text-transform:uppercase;}
.cv2-cab .logo-tab{background:#fff; padding:1vh .8vw; border-radius:.6vw; line-height:0;}
.cv2-cab .logo-tab img{height:9vh;}
.cv2-cuerpo{flex:1; display:flex; flex-direction:column; justify-content:center; gap:3.4vh; padding:2vh 3vw 8vh;}
.cv2-cuerpo h1{margin:0; font:700 clamp(46px,6.2vw,132px)/.98 var(--f-cond); letter-spacing:0; color:#fff;}
.cv2-cuerpo h1 em{font-style:normal; color:var(--s-yellow);}
.cv2-cuerpo p{margin:0; font-size:clamp(19px,1.9vw,42px); line-height:1.4; color:#CFE0FA; max-width:28ch;}
.cv2-cuerpo .btn2{align-self:flex-start; padding:2.2vh 2.6vw; font-size:clamp(22px,2.4vw,52px);}
.cv2-cuerpo small{font:600 clamp(14px,1.2vw,26px)/1 var(--f-cond); letter-spacing:.09em; text-transform:uppercase; color:#9FB9E6;}
.cv2-foto{position:relative; overflow:hidden;}
.cv2-foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 16%;}
.cv2-foto.sem img{object-position:50% 38%;}
.cv2-franja{position:absolute; left:0; right:0; bottom:0; height:5vh; background:#F2B418; z-index:3;}
body.en-cover #hud{opacity:0;}

/* ---------- objetivo ---------- */
.obj{flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:1.6vw; min-height:0;}
.obj-c{position:relative; text-align:left; border:0; background:#fff; border-radius:1.4vw; padding:2.6vh 1.8vw; display:flex; flex-direction:column; gap:1.2vh; cursor:pointer; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); transition:transform .3s var(--ease), background-color .25s; overflow:hidden; color:var(--s-navy);}
.obj-c:active{transform:scale(.985);}
.obj-n{width:9vh; height:9vh; border-radius:50%; display:grid; place-items:center; background:var(--s-navy); color:#fff; font:700 clamp(32px,5vh,76px)/1 var(--f-cond);}
.obj-c h3{margin:0; font:700 clamp(34px,4.2vw,90px)/1 var(--f-cond); color:var(--s-navy);}
.obj-c p{margin:0; font-size:clamp(17px,1.65vw,36px); line-height:1.4; color:var(--s-mut); max-height:0; opacity:0; transition:max-height .45s var(--ease), opacity .3s var(--ease);}
.obj-c.on p{max-height:22vh; opacity:1;}
.obj-c.on{transform:translateY(-1.2vh); background:#F4F7FC; box-shadow:0 1.6vh 2.8vh -1.2vh rgba(11,31,92,.45), inset 0 0 0 .4vh var(--s-navy);}
.obj-c::after{content:"Toca para ver"; margin-top:auto; font:600 clamp(13px,1.15vw,24px)/1 var(--f-cond); letter-spacing:.09em; text-transform:uppercase; color:var(--s-blue); transition:opacity .2s;}
.obj-c.on::after{opacity:0;}
.led2{display:flex; align-items:center; gap:1.4vw; background:var(--s-navy); color:#fff; border-radius:1.2vw; padding:2.2vh 1.8vw;}
.led2 b{flex:none; font:700 clamp(15px,1.45vw,31px)/1 var(--f-cond); letter-spacing:.08em; text-transform:uppercase; background:var(--s-yellow); color:var(--s-navy); padding:.8vh 1vw; border-radius:.4vw;}
.led2 p{margin:0; font:600 clamp(20px,2.2vw,48px)/1.15 var(--f-cond); color:#fff;}

/* ---------- mapa de la ruta ---------- */
.mapa-svg{width:100%; height:100%; display:block; overflow:visible;}
.mp-lin{fill:none; stroke-width:15; stroke-linecap:round;}
.mp-nom{font:700 28px var(--f-cond); letter-spacing:.06em; text-transform:uppercase;}
.mp-et{font:700 26px var(--f-cond); fill:var(--s-navy); text-anchor:middle; pointer-events:none;}
.mp-est{cursor:pointer; outline:none;}
.mp-est .anillo{transform-box:fill-box; transform-origin:center; transition:transform .25s var(--ease);}
@media (hover:hover){.mp-est:hover .anillo{transform:scale(1.18);}}
.mp-est:focus-visible .anillo{stroke:var(--s-pink);}
.mp-est:active .anillo{transform:scale(1.04);}
.mp-ping{transform-box:fill-box; transform-origin:center; animation:mpPing 1.8s var(--ease) infinite; fill:none; stroke-width:5;}
@keyframes mpPing{from{transform:scale(1); opacity:.9;} to{transform:scale(1.9); opacity:0;}}
.mp-term{fill:var(--s-navy);}
.mp-term-t{font:700 38px var(--f-cond); letter-spacing:.1em; fill:var(--s-navy); text-anchor:middle;}
.mp-et.b{fill:#fff;}
.mapa-cont{position:absolute; right:0; top:-1vh; font:600 clamp(14px,1.4vw,30px)/1 var(--f-cond); letter-spacing:.08em; text-transform:uppercase; color:var(--s-navy); background:#fff; padding:1vh 1.2vw; border-radius:.8vw; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.4);}
.m-body.mp{position:absolute;}

/* ---------- ¿Qué es? : sello de radicado ---------- */
.fund{flex:1; display:grid; grid-template-columns:1fr 1.15fr; gap:1.8vw; min-height:0;}
.fund-q{display:flex; flex-direction:column; gap:1.6vh;}
.fund-q .tag{align-self:flex-start; font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); letter-spacing:.07em; text-transform:uppercase; background:var(--s-navy); color:#fff; padding:.9vh 1.1vw; border-radius:.5vw;}
.fund-q p{margin:0; font:600 clamp(22px,2.5vw,56px)/1.25 'Public Sans',sans-serif; color:var(--s-navy);}
.fund-q p mark{background:#F6E2A6; color:inherit; padding:0 .2em; border-radius:.3em;}
.fund-s{display:flex; flex-direction:column; gap:1.6vh; min-height:0;}
.fund-tabs{display:flex; gap:.7vw; flex-wrap:wrap;}
.fund-tabs button{border:0; border-radius:.9vw; padding:1vh 1.2vw; background:#E4EEFB; color:var(--s-navy); font:700 clamp(15px,1.55vw,34px)/1 var(--f-cond); letter-spacing:.04em; text-transform:uppercase; cursor:pointer; transition:transform .16s var(--ease), background-color .2s;}
.fund-tabs button:active{transform:scale(.96);}
.fund-tabs button.on{background:var(--s-blue); color:#fff;}
.carta{position:relative; flex:1; min-height:0; background:#fff; border-radius:1.2vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.45); padding:2.4vh 2vw; display:flex; flex-direction:column; gap:1.2vh; overflow:hidden;}
.carta-t{font:700 clamp(24px,2.7vw,58px)/1 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; color:var(--s-navy);}
.carta-c{margin:0; font-size:clamp(16px,1.6vw,34px); line-height:1.4; color:var(--s-mut);}
.carta .btn2{align-self:flex-start; margin-top:auto;}
.sello{position:absolute; right:3%; top:14%; padding:1.2vh 1.4vw; border:.7vh solid var(--s-navy); border-radius:1vw; color:var(--s-navy); font:700 clamp(22px,2.7vw,58px)/1 var(--f-cond); letter-spacing:.06em; text-transform:uppercase; text-align:center; transform:rotate(-9deg) scale(2.4); opacity:0; pointer-events:none; background:rgba(255,255,255,.55);}
.sello small{display:block; font-size:.5em; letter-spacing:.1em; margin-top:.5vh;}
.carta.sella .sello{animation:selloKF .5s var(--ease) forwards;}
.carta.sella{animation:cartaKF .5s var(--ease);}
@keyframes selloKF{0%{opacity:0; transform:rotate(-20deg) scale(2.4);} 60%{opacity:1; transform:rotate(-8deg) scale(.96);} 100%{opacity:1; transform:rotate(-9deg) scale(1);}}
@keyframes cartaKF{0%,40%{transform:translateY(0);} 55%{transform:translateY(.6vh);} 100%{transform:translateY(0);}}

/* ---------- simulador de plazo ---------- */
.sim{flex:1; display:grid; grid-template-columns:1.25fr .75fr; grid-template-rows:minmax(0,1fr) auto; gap:1.8vw; min-height:0;}
.sim-izq{display:flex; flex-direction:column; justify-content:space-between; gap:1.6vh;}
.sim-tipos{display:grid; grid-template-columns:repeat(3,1fr); gap:1vw;}
.sim-tipos button{display:flex; flex-direction:column; align-items:flex-start; gap:.8vh; padding:1.6vh 1.1vw; border:0; border-radius:1.1vw; background:#EEF4FC; color:var(--s-navy); cursor:pointer; text-align:left; transition:transform .16s var(--ease), background-color .2s, box-shadow .2s;}
.sim-tipos button:active{transform:scale(.97);}
.sim-tipos b{font:700 clamp(32px,4.4vw,92px)/.9 var(--f-cond);}
.sim-tipos span{font:600 clamp(14px,1.4vw,30px)/1.15 'Public Sans',sans-serif;}
.sim-tipos button.on{color:#fff;}
.sim-tipos button[data-d="10"].on{background:var(--t10);} .sim-tipos button[data-d="15"].on{background:var(--t15);} .sim-tipos button[data-d="30"].on{background:var(--t30);}
.sim-opt{display:flex; align-items:center; gap:1vw; font:600 clamp(17px,1.7vw,36px)/1.2 'Public Sans',sans-serif; cursor:pointer;}
.sim-opt input{width:3.2vh; height:3.2vh; accent-color:var(--s-blue);}
.sim-sl{display:flex; align-items:center; gap:1.2vw;}
.sim-sl>span{flex:none; font:600 clamp(15px,1.5vw,32px)/1.1 'Public Sans',sans-serif; color:var(--s-mut); max-width:11ch;}
.sim-sl output{flex:none; min-width:2.2em; text-align:center; font:700 clamp(34px,4.4vw,92px)/1 var(--f-cond); color:var(--s-navy);}
.sim-sl input[type=range]{flex:1; min-width:0; height:5vh; accent-color:var(--s-blue);}
.sim-der{display:flex; align-items:center; gap:1.6vw;}
.sem{flex:none; display:flex; flex-direction:column; gap:1.2vh; padding:1.4vh .9vw; background:#10161F; border-radius:1.1vw;}
.sem i{display:block; width:6.2vh; height:6.2vh; border-radius:50%; background:#2A3342; transition:background-color .25s var(--ease), transform .3s var(--ease);}
.sem[data-e="v"] i:nth-child(3){background:#2FD07D; transform:scale(1.08);}
.sem[data-e="a"] i:nth-child(2){background:#FFC21A; transform:scale(1.08);}
.sem[data-e="r"] i:nth-child(1){background:#F25A4A; transform:scale(1.08);}
.sim-txt{display:flex; flex-direction:column; gap:.6vh; min-width:0;}
.sim-txt b{font:700 clamp(30px,3.6vw,78px)/1 var(--f-cond); color:var(--s-navy);}
.sim-txt span{font:600 clamp(15px,1.5vw,32px)/1.2 'Public Sans',sans-serif; color:var(--s-mut);}
.sim-txt em{font-style:normal; align-self:flex-start; font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); letter-spacing:.07em; text-transform:uppercase; padding:.8vh 1vw; border-radius:.5vw; background:#D9F0E2; color:#17603A; transition:background-color .25s, color .25s;}
.sim-der[data-e="a"] em{background:#FBEBB8; color:#6B4A00;} .sim-der[data-e="r"] em{background:#FADFDC; color:#8B2A24;}
.sim-bar{grid-column:1/-1; padding:2vh 1.8vw 1.6vh;}
.sim-reg{position:relative; height:5.4vh; background:#E4EEFB; border-radius:1vh; overflow:visible;}
.sim-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:1vh; background:var(--s-blue); transition:width .35s var(--ease), background-color .25s;}
.sim-reg[data-e="a"] .sim-fill{background:#E6A800;} .sim-reg[data-e="r"] .sim-fill{background:var(--s-red);}
.sim-marca{position:absolute; top:100%; font:600 clamp(12px,1.1vw,24px)/1 var(--f-cond); letter-spacing:.06em; color:var(--s-mut); transform:translateX(-50%); padding-top:.5vh; font-variant-numeric:tabular-nums;}
.sim-marca::before{content:""; position:absolute; left:50%; top:-5.4vh; height:5.4vh; border-left:1px solid rgba(11,31,92,.18);}
.sim-nota{margin:3.8vh 0 0; font-size:clamp(12px,1.05vw,22px); color:var(--s-mut);}

/* ---------- clasificador (buses 10 / 15 / 30) ---------- */
.cls{flex:1; display:grid; grid-template-rows:minmax(0,1fr) auto; gap:1.8vh; min-height:0; position:relative;}
.cls-carta{position:relative; display:flex; flex-direction:column; justify-content:center; gap:1.4vh; background:#fff; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); padding:2.2vh 2vw; overflow:hidden; animation:cartaEntra .45s var(--ease);}
@keyframes cartaEntra{from{opacity:0; transform:translateX(-4vw) rotate(-2deg);} to{opacity:1; transform:none;}}
.cls-carta.sale{transition:transform .5s var(--ease), opacity .4s var(--ease); opacity:0;}
.cls-carta.mal{animation:malKF .4s var(--ease);}
@keyframes malKF{0%,100%{transform:translateX(0);} 20%{transform:translateX(-1vw);} 45%{transform:translateX(.9vw);} 70%{transform:translateX(-.5vw);}}
.cls-n{position:absolute; right:1.4vw; top:1.4vh; font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); letter-spacing:.08em; color:var(--s-mut);}
.cls-t{margin:0; font:600 clamp(24px,3vw,66px)/1.25 'Public Sans',sans-serif; color:var(--s-navy); max-width:46ch;}
.cls-fb{min-height:5.6vh; font:600 clamp(17px,1.75vw,38px)/1.3 'Public Sans',sans-serif; color:var(--s-mut);}
.cls-fb.bien{color:#17603A;} .cls-fb.mal{color:#8B2A24;}
.cls-buses{display:grid; gap:1.2vw;}
.cls-bus{position:relative; display:flex; align-items:center; gap:1vw; border:0; border-radius:1.8vw 1.8vw 1vw 1vw; padding:1.4vh 1.2vw; background:var(--bc); color:var(--bt,#fff); text-align:left; cursor:pointer; box-shadow:0 1.2vh 2vh -1vh rgba(11,31,92,.5); transition:transform .18s var(--ease); }
.cls-bus:active{transform:scale(.97);}
@media (hover:hover){.cls-bus:hover{transform:translateY(-.8vh);}}
.cls-bus::after{content:""; position:absolute; left:8%; right:8%; bottom:-.6vh; height:.9vh; border-radius:.5vh; background:rgba(11,31,92,.35);}
.cls-bus b{flex:none; display:grid; place-items:center; min-width:5.4vw; height:7.4vh; background:#fff; color:var(--s-navy); border-radius:.7vw; font:700 clamp(30px,3.6vw,76px)/1 var(--f-cond);}
.cls-bus span{font:700 clamp(16px,1.6vw,34px)/1.1 var(--f-cond); letter-spacing:.03em; text-transform:uppercase;}
.cls-bus.ok{animation:busOk .5s var(--ease);} .cls-bus.no{animation:malKF .4s var(--ease); outline:.6vh solid var(--s-red);} .cls-bus.pista{animation:pista 1s var(--ease) 2;}
@keyframes busOk{0%{transform:translateY(0);} 35%{transform:translateY(-1.6vh);} 100%{transform:translateY(0);}}
@keyframes pista{0%,100%{transform:translateY(0);} 50%{transform:translateY(-1.2vh);}}
.cls-fin{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:1.8vh; background:#fff; border-radius:1.4vw; padding:2.4vh 2vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); animation:cartaEntra .5s var(--ease);}
.cls-fin h3{margin:0; font:700 clamp(36px,4.8vw,100px)/1 var(--f-cond); color:var(--s-navy);}
.cls-fin p{margin:0; font:600 clamp(18px,1.9vw,40px)/1.3 'Public Sans',sans-serif; color:var(--s-mut);}

/* ---------- respuesta de fondo ---------- */
.fondo{flex:1; display:grid; grid-template-columns:.9fr 1.3fr; gap:1.8vw; min-height:0;}
.fondo-q{display:flex; flex-direction:column; gap:1.4vh;}
.fondo-q button{display:flex; align-items:center; gap:1vw; border:0; border-radius:1.1vw; padding:1.5vh 1.2vw; background:#fff; color:var(--s-navy); font:700 clamp(20px,2.2vw,48px)/1.1 var(--f-cond); letter-spacing:.03em; text-align:left; cursor:pointer; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.4); transition:transform .16s var(--ease), background-color .2s;}
.fondo-q button:active{transform:scale(.97);}
.fondo-q button b{flex:none; width:6vh; height:6vh; border-radius:50%; display:grid; place-items:center; background:var(--s-blue); color:#fff; font-size:.9em;}
.fondo-q button.on{background:var(--s-navy); color:#fff;} .fondo-q button.on b{background:var(--s-yellow); color:var(--s-navy);}
.fondo-def{margin:0; font:600 clamp(17px,1.65vw,36px)/1.35 'Public Sans',sans-serif; color:var(--s-navy); background:#FFF6D8; border-radius:1.1vw; padding:1.6vh 1.3vw; min-height:9vh;}
.fondo-r{display:flex; flex-direction:column; gap:1.4vh; min-height:0;}
.fondo-p{margin:0; font:700 clamp(20px,2.2vw,48px)/1.2 var(--f-cond); letter-spacing:.02em; background:var(--s-navy); color:#fff; border-radius:1.1vw; padding:1.4vh 1.4vw;}
.fondo-op{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:1.2vw;}
.fondo-op button{position:relative; border:0; border-radius:1.2vw; background:#fff; padding:1.8vh 1.3vw; text-align:left; font:italic 500 clamp(16px,1.65vw,36px)/1.35 'Public Sans',sans-serif; color:var(--s-navy); cursor:pointer; box-shadow:0 1.2vh 2.2vh -1vh rgba(11,31,92,.4); transition:transform .18s var(--ease), background-color .2s;}
.fondo-op button:active{transform:scale(.98);}
.fondo-op button.ok{background:#D9F0E2;} .fondo-op button.no{background:#FADFDC; animation:malKF .4s var(--ease);}
.fondo-op button em{display:block; margin-top:1vh; font:700 clamp(15px,1.5vw,32px)/1.2 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; font-style:normal;}
.fondo-fb{margin:0; min-height:5vh; font:600 clamp(16px,1.55vw,33px)/1.3 'Public Sans',sans-serif; color:var(--s-navy);}

/* ---------- ampliación ---------- */
.amp{flex:1; display:grid; grid-template-columns:1fr 1.1fr; gap:1.8vw; min-height:0;}
.amp-c{display:flex; flex-direction:column; gap:1.3vh;}
.amp-c button{flex:1; display:flex; align-items:center; gap:1.1vw; border:0; border-radius:1.1vw; padding:1vh 1.2vw; background:#fff; color:var(--s-navy); text-align:left; font:600 clamp(17px,1.7vw,37px)/1.25 'Public Sans',sans-serif; cursor:pointer; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.4); transition:transform .16s var(--ease), background-color .2s;}
.amp-c button:active{transform:scale(.98);}
.amp-c button i{flex:none; width:5vh; height:5vh; border-radius:1vh; border:.5vh solid var(--s-line); display:grid; place-items:center; background:#fff; transition:background-color .2s, border-color .2s;}
.amp-c button i svg{width:70%; height:70%; opacity:0; transform:scale(.6); transition:opacity .2s, transform .25s var(--ease);}
.amp-c button.on{background:#EAF7EF;} .amp-c button.on i{background:var(--s-green); border-color:var(--s-green);} .amp-c button.on i svg{opacity:1; transform:none;}
.amp-r{display:flex; flex-direction:column; gap:1.4vh; min-height:0;}
.amp-b{flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:1vh;}
.amp-f{display:grid; grid-template-columns:5.6vw minmax(0,1fr); gap:1vw; align-items:center;}
.amp-f .ins2{display:grid; place-items:center; height:7.4vh; border-radius:.8vw; color:#fff; font:700 clamp(28px,3.2vw,68px)/1 var(--f-cond);}
.amp-pista{position:relative; height:7.4vh; background:#E4EEFB; border-radius:.8vw; overflow:hidden;}
.amp-pista .b1,.amp-pista .b2{position:absolute; top:0; bottom:0; display:flex; align-items:center; padding:0 .8vw; font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); white-space:nowrap;}
.amp-pista .b1{left:0; color:#fff;}
.amp-pista .b2{border:.4vh dashed currentColor; border-left:0; background:transparent; opacity:.35; transition:opacity .4s var(--ease), background-color .3s;}
.amp.listo .amp-pista .b2{opacity:1; background:rgba(255,255,255,.55);}
.amp-v{display:flex; align-items:center; gap:1.2vw; border-radius:1.2vw; padding:1.6vh 1.4vw; background:#FBEBB8; color:#5E4300; font:700 clamp(20px,2.2vw,48px)/1.1 var(--f-cond); letter-spacing:.03em; transition:background-color .3s, color .3s;}
.amp.listo .amp-v{background:#D9F0E2; color:#17603A;}

/* ---------- documentos: 10 días + 3 de entrega ---------- */
.doc{flex:1; display:flex; flex-direction:column; gap:2vh; min-height:0;}
.doc-pista{flex:1; position:relative; background:#fff; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); padding:2.2vh 1.6vw; display:flex; flex-direction:column; justify-content:center; gap:2vh;}
.doc-dias{display:grid; grid-template-columns:repeat(13,1fr); gap:.5vw;}
.doc-dias i{display:grid; place-items:center; height:9vh; border-radius:.8vw; background:#E4EEFB; color:var(--s-mut); font:700 clamp(18px,2.1vw,44px)/1 var(--f-cond); font-style:normal; transition:background-color .25s var(--ease), color .25s, transform .3s var(--ease);}
.doc-dias i.on{background:var(--s-blue); color:#fff; transform:translateY(-.8vh);}
.doc-dias i.ent{background:#FFF0C4;} .doc-dias i.ent.on{background:var(--s-yellow); color:var(--s-navy);}
.doc-leyenda{display:grid; grid-template-columns:10fr 3fr; gap:.5vw; font:700 clamp(14px,1.4vw,30px)/1 var(--f-cond); letter-spacing:.06em; text-transform:uppercase; color:var(--s-mut);}
.doc-leyenda span:last-child{text-align:center;}
.doc-estado{display:flex; align-items:center; gap:1.4vw; min-height:11vh;}
.doc-estado .sello2{flex:none; padding:1.2vh 1.4vw; border:.7vh solid var(--s-navy); border-radius:1vw; color:var(--s-navy); font:700 clamp(20px,2.4vw,52px)/1 var(--f-cond); letter-spacing:.06em; text-transform:uppercase; transform:rotate(-5deg) scale(1.8); opacity:0;}
.doc-estado .sello2.on{animation:sello2KF .5s var(--ease) forwards;}
@keyframes sello2KF{0%{opacity:0; transform:rotate(-14deg) scale(2.2);} 60%{opacity:1; transform:rotate(-4deg) scale(.96);} 100%{opacity:1; transform:rotate(-5deg) scale(1);}}
.doc-estado p{margin:0; font:600 clamp(18px,1.9vw,40px)/1.3 'Public Sans',sans-serif; color:var(--s-navy);}
.doc-acc{display:flex; gap:1vw; align-items:center;}
.doc-acc .chip-reserva{margin-left:auto; font:600 clamp(15px,1.5vw,32px)/1.25 'Public Sans',sans-serif; background:#FFF6D8; color:#5E4300; border-radius:1vw; padding:1.2vh 1.2vw; max-width:46ch;}

/* ---------- recursos ---------- */
.rec{flex:1; display:grid; grid-template-columns:1fr 1.1fr; gap:1.8vw; min-height:0;}
.rec-q{display:flex; flex-direction:column; gap:1.4vh;}
.rec-q button{flex:1; display:flex; align-items:center; gap:1.2vw; border:0; border-radius:1.2vw; padding:1.2vh 1.3vw; background:#fff; color:var(--s-navy); text-align:left; font:600 clamp(18px,1.85vw,40px)/1.25 'Public Sans',sans-serif; cursor:pointer; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.4); transition:transform .16s var(--ease), background-color .2s;}
.rec-q button:active{transform:scale(.98);}
.rec-q button b{flex:none; width:6.4vh; height:6.4vh; border-radius:50%; display:grid; place-items:center; background:var(--s-blue); color:#fff; font:700 clamp(22px,2.4vw,50px)/1 var(--f-cond);}
.rec-q button.on{background:var(--s-navy); color:#fff;} .rec-q button.on b{background:var(--s-yellow); color:var(--s-navy);}
.rec-r{position:relative; display:flex; flex-direction:column; justify-content:center; gap:1.8vh; background:#fff; border-radius:1.4vw; padding:2.4vh 2vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); min-height:0;}
.rec-r .vacio{font:600 clamp(20px,2.1vw,46px)/1.3 'Public Sans',sans-serif; color:var(--s-mut);}
.rec-tag{align-self:flex-start; font:700 clamp(30px,3.8vw,80px)/1 var(--f-cond); letter-spacing:.04em; text-transform:uppercase; padding:1vh 1.4vw; border-radius:.8vw; color:#fff; animation:cartaEntra .4s var(--ease);}
.rec-txt{margin:0; font:600 clamp(20px,2.1vw,46px)/1.3 'Public Sans',sans-serif; color:var(--s-navy); animation:cartaEntra .4s var(--ease);}

/* ---------- tutelas ---------- */
.tut{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:1.8vw; min-height:0;}
.mito{display:flex; flex-direction:column; justify-content:center; gap:1.6vh; background:#fff; border-radius:1.4vw; padding:2.4vh 2vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); position:relative; overflow:hidden;}
.mito q{display:block; font:700 clamp(28px,3.4vw,74px)/1.1 var(--f-cond); color:var(--s-navy); quotes:"«" "»";}
.mito p{margin:0; font:600 clamp(18px,1.8vw,38px)/1.35 'Public Sans',sans-serif; color:var(--s-mut); min-height:12vh;}
.mito .sello3{position:absolute; right:2vw; top:2vh; padding:1vh 1.4vw; border:.7vh solid var(--s-red); border-radius:1vw; color:var(--s-red); font:700 clamp(28px,3.2vw,70px)/1 var(--f-cond); letter-spacing:.08em; transform:rotate(-8deg) scale(2.2); opacity:0; pointer-events:none;}
.mito.revela .sello3{animation:selloKF .5s var(--ease) forwards;}
.tut-d{display:flex; flex-direction:column; gap:1.6vh; min-height:0;}
.tut-ruta{position:relative; flex:1; background:#fff; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); padding:2vh 1.6vw; display:flex; flex-direction:column; justify-content:space-between; min-height:0; overflow:hidden;}
.tut-nodos{display:grid; grid-template-columns:1fr 1.1fr; gap:2vw; align-items:center; flex:1;}
.tut-nodo{display:grid; place-items:center; text-align:center; gap:.8vh; font:700 clamp(18px,1.9vw,40px)/1.1 var(--f-cond); letter-spacing:.04em; text-transform:uppercase; color:var(--s-navy);}
.tut-nodo i{display:block; width:7.5vh; height:7.5vh; border-radius:50%; background:#E4EEFB; transition:background-color .3s;}
.tut-nodo.on i{background:var(--s-green);}
.tut-dest{display:flex; flex-direction:column; gap:1.2vh;}
.tut-dest .tut-nodo{grid-template-columns:auto 1fr; text-align:left; justify-items:start;}
.tut-sobre{position:absolute; left:6%; top:36%; width:5vw; height:3.6vw; background:var(--s-yellow); border-radius:.4vw; opacity:0; display:grid; place-items:center; color:var(--s-navy); font:700 clamp(15px,1.5vw,30px)/1 var(--f-cond);}
.tut-sobre.vuela{animation:sobreKF 1.8s var(--ease) forwards;}
@keyframes sobreKF{0%{opacity:0; transform:translate(0,0) scale(.8);} 12%{opacity:1; transform:translate(0,0) scale(1);} 55%{opacity:1; transform:translate(20vw,0) scale(1);} 100%{opacity:1; transform:translate(33vw,-4vh) scale(.9);}}
.tut-regla{margin:0; font:600 clamp(17px,1.65vw,36px)/1.3 'Public Sans',sans-serif; color:var(--s-navy); background:#FFF6D8; border-radius:1.1vw; padding:1.4vh 1.3vw;}
.hechos{display:flex; gap:.8vw; flex-wrap:wrap;}
.hechos span{font:700 clamp(15px,1.5vw,32px)/1.1 var(--f-cond); letter-spacing:.04em; text-transform:uppercase; background:var(--s-navy); color:#fff; padding:1vh 1vw; border-radius:.6vw;}

/* ---------- comparación petición / tutela ---------- */
.cmp2{flex:1; display:flex; flex-direction:column; gap:1.8vh; min-height:0;}
.seg{align-self:flex-start; display:flex; background:#fff; border-radius:1.3vw; padding:.6vh; box-shadow:0 1vh 2vh -1vh rgba(11,31,92,.4);}
.seg button{border:0; border-radius:1vw; padding:1.4vh 2vw; background:transparent; color:var(--s-navy); font:700 clamp(18px,2vw,44px)/1 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; transition:background-color .25s var(--ease), color .25s, transform .16s var(--ease);}
.seg button:active{transform:scale(.97);}
.seg button.on{background:var(--s-blue); color:#fff;} .seg button[data-k="t"].on{background:var(--s-red);}
.cmp2-tabla{flex:1; display:grid; grid-template-rows:repeat(4,1fr); gap:1.2vh; min-height:0;}
.cmp2-f{display:grid; grid-template-columns:.7fr 2fr; align-items:center; gap:1.4vw; background:#fff; border-radius:1.1vw; padding:0 1.4vw; box-shadow:0 .8vh 1.8vh -1vh rgba(11,31,92,.4);}
.cmp2-f b{font:700 clamp(17px,1.7vw,36px)/1.1 var(--f-cond); letter-spacing:.06em; text-transform:uppercase; color:var(--s-mut);}
.cmp2-f span{font:600 clamp(19px,2vw,44px)/1.25 'Public Sans',sans-serif; color:var(--s-navy); transition:opacity .22s var(--ease), transform .22s var(--ease);}
.cmp2.cambia .cmp2-f span{opacity:0; transform:translateX(1.2vw);}

/* ---------- gestión del plazo ---------- */
.ges{flex:1; display:flex; flex-direction:column; gap:2vh; min-height:0;}
.ges-via{position:relative; background:#fff; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); padding:8vh 2vw 2vh;}
.ges-linea{position:relative; height:1.2vh; background:#DCE8FA; border-radius:1vh; margin:0 10%;}
.ges-linea i{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--s-blue); border-radius:1vh; transition:width .8s var(--ease);}
.ges-paradas{display:grid; grid-template-columns:repeat(5,1fr); margin-top:-4.4vh;}
.ges-p{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:1vh; cursor:pointer; padding:0; font:700 clamp(16px,1.6vw,34px)/1.1 var(--f-cond); letter-spacing:.03em; text-transform:uppercase; color:var(--s-navy); }
.ges-p b{width:7.6vh; height:7.6vh; border-radius:50%; display:grid; place-items:center; background:#fff; border:.7vh solid #B9CBE8; color:var(--s-navy); font:700 clamp(22px,2.6vw,56px)/1 var(--f-cond); transition:background-color .3s var(--ease), border-color .3s, color .3s, transform .3s var(--ease);}
.ges-p.on b{background:var(--s-blue); border-color:var(--s-blue); color:#fff;}
.ges-p.ya b{transform:scale(1.18); background:var(--s-yellow); border-color:var(--s-yellow); color:var(--s-navy);}
.ges-bus{position:absolute; top:.3vh; left:0; width:5.4vw; pointer-events:none; transition:transform .8s var(--ease);}
.ges-bus svg{display:block; width:100%; height:auto;}
.ges-det{flex:1; display:grid; grid-template-columns:1fr auto; gap:1.6vw; align-items:center; background:var(--s-navy); color:#fff; border-radius:1.4vw; padding:2vh 2vw; min-height:0;}
.ges-det h3{margin:0 0 .6vh; font:700 clamp(28px,3.4vw,72px)/1 var(--f-cond); color:var(--s-yellow);}
.ges-det p{margin:0; font:500 clamp(18px,1.9vw,40px)/1.3 'Public Sans',sans-serif;}
.ges-det .btn2{align-self:center;}
.ges-plz{display:flex; height:6.4vh; border-radius:1vw; overflow:hidden; font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); letter-spacing:.03em;}
.ges-plz span{display:flex; align-items:center; padding:0 1vw; white-space:nowrap; opacity:.5; transition:opacity .35s var(--ease);}
.ges-plz .a{flex:0 0 62%; background:#BCD6F7; color:#17509F;} .ges-plz .b{flex:1; background:var(--s-yellow); color:var(--s-navy);}
.ges-plz.A .a,.ges-plz.B .b{opacity:1;}

/* ---------- demora interna: fichas de dominó ---------- */
.dem{flex:1; display:grid; grid-template-rows:minmax(0,1fr) auto; gap:2vh; min-height:0;}
.dem-fichas{display:flex; align-items:flex-end; justify-content:center; gap:3.4vw; padding:0 3vw; background:#fff; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); min-height:0; overflow:hidden;}
.ficha{position:relative; flex:1; max-width:15vw; height:70%; margin-bottom:0; transform-origin:100% 100%; transition:transform .55s var(--ease), background-color .3s; transition-delay:calc(var(--k) * .42s); background:var(--s-blue); color:#fff; border-radius:1vw 1vw .4vw .4vw; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vh; text-align:center; padding:1vh .6vw;}
.ficha b{font:700 clamp(18px,1.9vw,40px)/1.1 var(--f-cond); letter-spacing:.03em; text-transform:uppercase;}
.ficha span{font:500 clamp(13px,1.3vw,28px)/1.25 'Public Sans',sans-serif;}
.ficha:nth-child(4){background:var(--s-red);}
.dem.cae .ficha{transform:rotate(68deg);}
.dem.cae .ficha:nth-child(4){transform:rotate(78deg);}
.dem.tiempo .ficha{background:var(--s-green); transition-delay:0s;}
.dem-ctl{display:flex; align-items:center; gap:1.6vw;}
.dem-ctl .sim-opt{background:#fff; border-radius:1.1vw; padding:1.4vh 1.4vw; box-shadow:0 .8vh 1.8vh -1vh rgba(11,31,92,.4);}
.dem-fb{margin-left:auto; font:700 clamp(20px,2.2vw,48px)/1.1 var(--f-cond); letter-spacing:.03em; color:var(--s-navy); max-width:26ch; text-align:right;}

/* ---------- Terminal Jurídica: antes y ahora ---------- */
.ter{flex:1; display:grid; grid-template-columns:1.3fr .7fr; gap:1.8vw; min-height:0;}
.ter-izq{display:flex; flex-direction:column; gap:1.6vh; min-height:0;}
.ter-pan{position:relative; flex:1; min-height:0; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.4); overflow:hidden; background:#fff;}
.ter-antes,.ter-ahora{position:absolute; inset:0; padding:2vh 1.6vw; transition:opacity .35s var(--ease), transform .35s var(--ease);}
.ter-antes{background:#F1F4F9; opacity:0; transform:translateX(4%); pointer-events:none;}
.ter.antes .ter-antes{opacity:1; transform:none; pointer-events:auto;} .ter.antes .ter-ahora{opacity:0; transform:translateX(-4%); pointer-events:none;}
.nota-pegada{position:absolute; width:20%; padding:1.4vh .9vw; background:#E4EAF3; color:var(--s-navy); font:600 clamp(15px,1.55vw,34px)/1.2 'Public Sans',sans-serif; border-radius:.3vw; box-shadow:0 .8vh 1.4vh -.6vh rgba(0,0,0,.35); transform:rotate(var(--r)); }

.ter-fila{display:grid; grid-template-columns:auto 1fr auto; gap:1.1vw; align-items:center; padding:1.3vh .4vw; border-bottom:1px solid var(--s-line); cursor:pointer; background:transparent; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; transition:background-color .2s;}
.ter-fila:hover{background:#F2F7FD;}
.ter-fila .luz{width:3.6vh; height:3.6vh; border-radius:50%; background:var(--c);}
.ter-fila b{display:block; font:700 clamp(17px,1.8vw,38px)/1.15 'Public Sans',sans-serif; color:var(--s-navy);}
.ter-fila span{font:500 clamp(13px,1.3vw,28px)/1.2 'Public Sans',sans-serif; color:var(--s-mut);}
.ter-fila em{font:700 clamp(15px,1.5vw,32px)/1 var(--f-cond); letter-spacing:.05em; text-transform:uppercase; font-style:normal; padding:.7vh .8vw; border-radius:.5vw; background:#E4EEFB; color:var(--s-navy);}
.ter-sobre{position:absolute; right:2vw; bottom:2vh; display:flex; align-items:center; gap:.8vw; background:var(--s-navy); color:#fff; border-radius:1vw; padding:1.2vh 1.2vw; font:600 clamp(15px,1.5vw,32px)/1.2 'Public Sans',sans-serif; opacity:0; transform:translateY(2vh) scale(.95); transition:opacity .3s var(--ease), transform .4s var(--ease);}
.ter-sobre.on{opacity:1; transform:none;}
.ter-der{display:flex; flex-direction:column; gap:1.2vh;}
.ter-der .chip{flex:1; display:flex; align-items:center; gap:1vw; background:#fff; border-radius:1.1vw; padding:0 1.2vw; box-shadow:0 .8vh 1.8vh -1vh rgba(11,31,92,.4); font:700 clamp(18px,1.95vw,42px)/1.1 var(--f-cond); letter-spacing:.03em; text-transform:uppercase; color:var(--s-navy);}
.ter-der .chip small{display:block; margin-top:.3vh; font:500 clamp(13px,1.25vw,27px)/1.2 'Public Sans',sans-serif; letter-spacing:0; text-transform:none; color:var(--s-mut);}
.ter-der .chip i{flex:none; width:5vh; height:5vh; border-radius:50%; display:grid; place-items:center; background:var(--s-navy); color:#fff; font:700 clamp(20px,2.2vw,44px)/1 var(--f-cond); font-style:normal;}


/* ---------- QR ---------- */
.qr2{flex:1; display:grid; grid-template-columns:auto minmax(0,1fr); gap:3vw; align-items:center; min-height:0;}
.qr2-c{display:flex; flex-direction:column; gap:1.4vh; align-items:stretch;}
.qr2-c img{width:min(42vh,26vw); height:min(42vh,26vw); background:#fff; padding:1.4vh; border-radius:1.4vw; box-shadow:0 1.2vh 2.6vh -1.2vh rgba(11,31,92,.45); display:block;}

<script>
/* ruta del reto: 10 paradas (preguntas) y la terminal (podio); la usan la sala de espera y el juego */
function rutaHTML(){
  let st=""; for(let i=0;i<10;i++) st+=`<b class="rt-p" style="left:${((i+.5)/11*100).toFixed(2)}%"></b>`;
  return `<div class="mh-ruta" role="img" aria-label="Ruta del reto: 10 paradas y la terminal"><div class="rt-linea"><i class="rt-base"></i><i class="rt-prog"></i>${st}<span class="rt-fin" style="left:${(10.5/11*100).toFixed(2)}%">${Ico("trofeo")}</span><span class="rt-bus"><svg viewBox="0 0 62 28" aria-hidden="true">${busG("#1767B8")}</svg></span></div><div class="rt-txt"><span>Ruta del reto</span><b class="rt-b">Salida</b></div></div>`;
}
function rutaPon(idx){
  rutaPon.last = idx;
  const pos=((Math.max(idx,0)+.5)/11*100)+"%", t=idx<0?"Salida":idx<10?"Parada "+(idx+1)+" de 10":"Terminal: el podio";
  document.querySelectorAll(".mh-ruta").forEach(r=>{
    r.classList.toggle("llego",idx>=10);
    r.querySelectorAll(".rt-p").forEach((p,i)=>{ p.classList.toggle("ok",i<idx); p.classList.toggle("ya",i===idx); });
    const W = r.querySelector(".rt-linea").clientWidth, fr = (idx>=10 ? 10.5 : idx<0 ? .22 : idx+.5) / 11;
    r.querySelector(".rt-bus").style.setProperty("--bx", (fr * W).toFixed(1) + "px");
    r.querySelector(".rt-prog").style.transform = "scaleX(" + Math.max(0, Math.min(1, (fr - .5/11) / (10/11))).toFixed(3) + ")";
    r.querySelector(".rt-b").textContent = t;
  });
}
window.addEventListener("resize", ()=>{ if(rutaPon.last !== undefined) rutaPon(rutaPon.last); });
function busG(color){ return `<rect x="1" y="2" width="60" height="22" rx="5" fill="${color}"/><rect x="1" y="14.5" width="60" height="3" fill="#D6488E"/>${[5,14,23,32,41].map(x=>`<rect x="${x}" y="6" width="7.5" height="7" rx="1.5" fill="#CDE5F7"/>`).join("")}<rect x="50" y="5.5" width="8.5" height="9" rx="1.5" fill="#AACDEC"/><circle cx="60.5" cy="19.5" r="1.6" fill="#FFE282"/>${[12,49].map(x=>`<circle cx="${x}" cy="25" r="4.6" fill="#141E2C"/><circle cx="${x}" cy="25" r="1.9" fill="#96A0AF"/>`).join("")}`; }

/* ===================== LA RUTA DEL SETP: presentación interactiva y no lineal ===================== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RUTAS = {
  1: { n: "La norma", c: "#fff", t: "var(--s-navy)", b: "1" }, 2: { n: "La respuesta", c: "#fff", t: "var(--s-navy)", b: "2" },
  3: { n: "El riesgo", c: "#fff", t: "var(--s-navy)", b: "3" }, 4: { n: "La herramienta", c: "#fff", t: "var(--s-navy)", b: "4" }, 5: { n: "Terminal", c: "#fff", t: "var(--s-navy)", b: "T" }
};
const RUTA_EST = { 1: ["fundamento", "terminos", "clasificar", "caso"], 2: ["fondo", "ampliacion", "documentos", "recursos"], 3: ["tutelas", "comparativa", "gestion", "demora"], 4: ["terminal", "demoqr"], 5: ["cierre", "normativa", "cuestionario"] };
const NOMBRE = { fundamento: "¿Qué es el derecho de petición?", terminos: "Los tres términos", clasificar: "Información o consulta", caso: "Caso práctico", fondo: "Respuesta de fondo", ampliacion: "Ampliar el término", documentos: "Si no responden", recursos: "¿Hay recurso?", tutelas: "Tutelas", comparativa: "Petición y tutela", gestion: "Gestión del plazo", demora: "Demora interna", terminal: "Terminal Jurídica", demoqr: "Pruébala", cierre: "Cierre", normativa: "Normativa", cuestionario: "Reto en vivo" };
const CORTO = { fundamento: "¿Qué es?", terminos: "Los tres términos", clasificar: "Información o consulta", caso: "Caso práctico", fondo: "Respuesta de fondo", ampliacion: "Ampliar el término", documentos: "Si no responden", recursos: "¿Hay recurso?", tutelas: "Tutelas", comparativa: "Petición y tutela", gestion: "Gestión del plazo", demora: "Demora interna", terminal: "Terminal Jurídica", demoqr: "Pruébala", cierre: "Cierre", normativa: "Normativa", cuestionario: "Reto en vivo" };
const rutaDe = id => +Object.keys(RUTA_EST).find(r => RUTA_EST[r].includes(id)) || 0;
const TIPS = {
  objetivo: "Toca cada verbo: así se trabaja cada solicitud que llega.",
  mapa: "Elige una parada. Puedes recorrer la ruta en el orden que quieras.",
  fundamento: "Radica distintos escritos: ¿cambia algo el título?",
  terminos: "Elige un término y mueve los días: mira cómo cambia el semáforo.",
  clasificar: "Arrastra cada solicitud al bus que le corresponde.",
  caso: "Un solo escrito, cinco puntos. Sube cada uno al bus correcto.",
  fondo: "Toca cada sello y elige la respuesta que sí es de fondo.",
  ampliacion: "Marca las cuatro condiciones para poder ampliar el término.",
  documentos: "Corre los días y mira qué pasa al llegar al día 10.",
  recursos: "Toca una situación y mira qué procede.",
  tutelas: "¿Verdad o mito? Toca la tarjeta y luego envía una tutela.",
  comparativa: "Cambia de lado y compara punto por punto.",
  gestion: "Avanza el bus por las cinco paradas del plazo.",
  demora: "Empuja la primera ficha. ¿Y si el área entrega a tiempo?",
  terminal: "Cambia entre antes y ahora. Toca una fila para ver el aviso.",
  demoqr: "Escanea el código y entra a consultar.",
  cierre: "Repasa lo que quieras o sube al reto en vivo.",
  normativa: "Toca una norma para volver a la parada donde la usamos."
};
const ICO_MAPA = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22 C10 22 9 10 16 10 S23 22 27 22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="5" cy="22" r="3.4" fill="currentColor"/><circle cx="27" cy="22" r="3.4" fill="currentColor"/><circle cx="16" cy="10" r="3.4" fill="currentColor"/></svg>`;
const ICO_OK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const SLIDES = [], INIT = {}, ENTER = {}, VIS = new Set();
function slide(id, cls, html) { SLIDES.push({ id, cls: cls || "", html }); }
function M(id, ruta, titulo, body) {
  const R = RUTAS[ruta];
  slide(id, "m", `<div class="m-top"><button class="m-mapa" data-ir="mapa" aria-label="Volver al mapa de la ruta">${ICO_MAPA}Mapa</button>
    <div class="m-plate" style="--rc:${R.c};--rt:${R.t}"><b class="m-badge">${R.b}</b><h2>${titulo}</h2><span class="m-ruta">${R.n}</span></div></div>
    <div class="m-body">${body}</div>`);
}
const irId = id => ir(SLIDES.findIndex(s => s.id === id));
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

/* ===================== SETPI, guía de la ruta ===================== */
const Guia = (() => {
  let A = null, ok = false, stage = null, activo = true, raf = 0, last = 0, hideT = 0; const cola = [];
  const H = () => innerHeight, W = () => innerWidth;
  const cuando = f => ok ? f() : cola.push(f);
  function loop() { const f = ts => { raf = requestAnimationFrame(f); if (!activo || document.hidden) { last = 0; return; } const dt = Math.min(.05, (ts - (last || ts)) / 1000); last = ts; A.update(dt); }; raf = requestAnimationFrame(f); }
  function init() {
    stage = document.getElementById("guia-stage");
    if (!(window.Setpi && Setpi.Frames && Setpi.Actor)) return;
    Setpi.base = "setpi/";
    Setpi.Frames.load("setpi/").then(() => { A = new Setpi.Actor(stage); A.setCap(Math.max(240, H() * .36)); ok = true; A.show(true); A.rest("F"); loop(); cola.splice(0).forEach(f => f()); }).catch(() => { });
  }
  function colocar(x, y, s) { cuando(() => { A.cancel(); A.setS(s); A.place(x, y); A.face(1); A.rest("F"); }); }
  async function clip(fr, o) { if (!ok) return; try { A.cancel(); await A.play(fr, o); } catch (e) { if (e !== Setpi.CANCEL) { /* otra animación tomó el control */ } return; } A.rest("F"); }
  let habla = false;
  function di(t, ms, size) { if (!habla) return; cuando(() => { Setpi.say(A, t, { minX: W() * .03, maxX: W() * .98, minY: H() * .02, size: size || .15, maxW: Math.min(W() * .34, A.S * 3.4) }); clearTimeout(hideT); hideT = setTimeout(() => Setpi.sayClear(A), ms || 3800); }); }
  const R = {
    ok: () => clip(Setpi.C.likeF()), no: () => clip(Setpi.C.shake(2)), win: () => clip(Setpi.C.likeF()),
    think: () => clip(Setpi.C.think()), wave: () => clip(Setpi.C.waveF(1, 1.4)), point: () => clip(Setpi.C.present()), alert: () => clip(Setpi.C.think()),
    clap: () => clip(Setpi.C.applaud(3)), lupa: () => clip(Setpi.C.lupa()), tablet: () => clip(Setpi.C.tablet()), talk: () => clip(Setpi.C.talk()), shrug: () => clip(Setpi.C.shrug()), dance: () => clip(Setpi.C.talk())
  };
  return {
    init, activo(v) { activo = v; if (!v) { try { A && A.cancel(); } catch (e) { } } },
    casa() { colocar(W() * .945, H() * .858, H() * .15); },
    portada() { colocar(W() * .8, H() * .93, H() * .27); },
    en(x, y, s) { colocar(x, y, s); },
    react(k) { cuando(() => R[k] && R[k]()); },
    di, habla(v) { habla = v; },
    corre(x, y) { return new Promise(res => { if (!ok) return res(); A.cancel(); A.moveTo(x, y, { speed: A.S * 3, gait: "run" }).then(() => { A.rest("F"); res(); }).catch(() => res()); }); },
    pos() { return ok ? { x: A.x, y: A.y } : null }
  };
})();

/* ===================== pantalla del bus (consejo) y siguiente parada ===================== */
const HUD = {
  init() {
    const d = document.createElement("div"); d.id = "hud";
    d.innerHTML = `<div class="hud-led"><b class="hud-n"></b><p class="hud-t"></p></div><button class="hud-sig"></button>`;
    document.body.appendChild(d); this.n = $(".hud-n", d); this.t = $(".hud-t", d); this.sig = $(".hud-sig", d);
    this.sig.addEventListener("click", () => { if (this.dest) irId(this.dest); });
  },
  set(id) {
    const r = rutaDe(id), lista = RUTA_EST[r] || [], k = lista.indexOf(id), sig = k >= 0 && k < lista.length - 1 ? lista[k + 1] : null;
    this.n.textContent = RUTAS[r] ? RUTAS[r].b : "1";
    this.t.classList.add("cambia"); const txt = TIPS[id] || ""; setTimeout(() => { this.t.textContent = txt; this.t.classList.remove("cambia"); }, 160);
    if (id === "mapa") { this.sig.style.display = "none"; this.dest = null; return; }
    this.sig.style.display = ""; this.dest = sig || "mapa"; this.sig.textContent = sig ? "Siguiente parada ▸" : "Volver al mapa ▸";
  }
};

/* ===================== diapositivas ===================== */
slide("cover", "cv2", `
  <div class="cv2-izq">
    <div class="cv2-cab"><span class="logo-tab"><img src="img/setp-logo-color.png" alt="TransMusical SETP"></span><span>Capacitación interna<br>SETP Ibagué</span></div>
    <div class="cv2-cuerpo">
      <h1>Derecho de petición: <em>términos</em> y respuesta de fondo</h1>
      <p>Cómo identificar la solicitud, asignar el término y coordinar una respuesta oportuna.</p>
      <button class="btn2 y" data-ir="objetivo">Iniciar la ruta ▸</button>
      <small>Área Jurídica · Material de apoyo</small>
    </div>
  </div>
  <div class="cv2-foto"><img src="img/paradero-carrera5-vertical.jpg" alt="Paradero TransMusical en la carrera 5 con calle 30, Ibagué"></div>
  <div class="cv2-franja"></div>`);

M("objetivo", 1, "¿Qué buscamos hoy?", `
  <div class="obj">
    <button class="obj-c"><b class="obj-n">1</b><h3>Identificar</h3><p>Reconocer qué está solicitando realmente la persona.</p></button>
    <button class="obj-c"><b class="obj-n">2</b><h3>Clasificar</h3><p>Distinguir información, consulta y solicitudes generales.</p></button>
    <button class="obj-c"><b class="obj-n">3</b><h3>Coordinar</h3><p>Dar tiempo suficiente para elaborar y comunicar una respuesta completa.</p></button>
  </div>
  <div class="led2"><b>Idea central</b><p>El término no se define solo por el título del escrito, sino por su contenido y por las normas aplicables.</p></div>`);
INIT.objetivo = el => $$(".obj-c", el).forEach(c => c.addEventListener("click", () => { const abre = !c.classList.contains("on"); $$(".obj-c", el).forEach(x => x.classList.remove("on")); c.classList.toggle("on", abre); if (abre) Guia.react("point"); }));

M("mapa", 1, "Mapa de la ruta", `<div id="mapa-svg" style="flex:1;min-height:0"></div>`);

/* ---- mapa de la ruta: cuatro líneas y una terminal; se puede ir a cualquier parada ---- */
const LINEAS = [{ r: 1, y: 58, col: "#2A5BA0" }, { r: 2, y: 184, col: "#2A5BA0" }, { r: 3, y: 310, col: "#2A5BA0" }, { r: 4, y: 436, col: "#2A5BA0" }];
function etiqueta(t) { const p = t.split(" "); if (t.length <= 18 || p.length < 2) return [t]; let best = 1, d = 99; for (let i = 1; i < p.length; i++) { const a = p.slice(0, i).join(" ").length, b = p.slice(i).join(" ").length, dd = Math.abs(a - b); if (dd < d) { d = dd; best = i; } } return [p.slice(0, best).join(" "), p.slice(best).join(" ")]; }
function mapaSVG() {
  const xs = [470, 720, 970, 1220]; let s = `<svg class="mapa-svg" viewBox="0 0 1600 540" role="group" aria-label="Mapa de la ruta de la capacitación">`;
  LINEAS.forEach(L => {
    s += `<path class="mp-lin" d="M120 ${L.y}H1340" stroke="${L.col}"/><circle cx="82" cy="${L.y}" r="40" fill="#0B1F5C"/><text x="82" y="${L.y + 15}" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="46" fill="#fff">${L.r}</text>`;
    s += `<text class="mp-nom" x="132" y="${L.y - 28}" fill="#0B1F5C">${RUTAS[L.r].n}</text>`;
    RUTA_EST[L.r].forEach((id, k) => {
      const x = xs[k], lab = etiqueta(CORTO[id]);
      s += `<g class="mp-est" data-id="${id}" tabindex="0" role="button" aria-label="${esc(NOMBRE[id])}" transform="translate(${x},${L.y})"><circle class="mp-ping" r="26" stroke="#F2B418" opacity="0"/><circle class="anillo" r="27" fill="#fff" stroke="${L.col}" stroke-width="11"/><circle class="vis" r="12" fill="#F2B418" opacity="0"/>${lab.map((t, i) => `<text class="mp-et" y="${57 + i * 27}">${esc(t)}</text>`).join("")}<rect x="-130" y="-40" width="260" height="${72 + lab.length * 31}" fill="transparent"/></g>`;
    });
  });
  s += `<rect x="1340" y="12" width="260" height="516" rx="30" class="mp-term"/><rect x="1340" y="12" width="260" height="76" rx="30" fill="#F2B418"/><rect x="1340" y="58" width="260" height="30" fill="#F2B418"/><text class="mp-term-t" x="1470" y="63">TERMINAL</text>`;
  RUTA_EST[5].forEach((id, k) => { const y = 178 + k * 128; s += `<g class="mp-est" data-id="${id}" tabindex="0" role="button" aria-label="${esc(NOMBRE[id])}" transform="translate(1385,${y})"><circle class="mp-ping" r="26" stroke="#F2B418" opacity="0"/><circle class="anillo" r="27" fill="#fff" stroke="#F2B418" stroke-width="11"/><circle class="vis" r="12" fill="#F2B418" opacity="0"/><text class="mp-et b" x="38" y="10" style="text-anchor:start">${esc(CORTO[id])}</text><rect x="-34" y="-34" width="262" height="68" fill="transparent"/></g>`; });
  return s + `</svg>`;
}
INIT.mapa = el => {
  $("#mapa-svg", el).innerHTML = mapaSVG();

    carta.addEventListener("pointerdown", e => { if (st.bloq) return; arr = { x: e.clientX, y: e.clientY, tx: +carta.dataset.tx, ty: +carta.dataset.ty }; carta.setPointerCapture(e.pointerId); carta.style.cursor = "grabbing"; carta.style.animation = "none"; carta.style.transition = "none"; });
    carta.addEventListener("pointermove", e => { if (!arr) return; const tx = arr.tx + e.clientX - arr.x, ty = arr.ty + e.clientY - arr.y; carta.dataset.tx = tx; carta.dataset.ty = ty; carta.style.transform = `translate(${tx}px,${ty}px)`; const b = busBajo(e); $$(".cls-bus", raiz).forEach(x => x.style.transform = x === b ? "translateY(-1vh)" : ""); });
    const busBajo = e => { const bs = $$(".cls-bus", raiz); return bs.find(b => { const r = b.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 20 && e.clientY <= r.bottom; }); };

/* ===================== el mundo del SETP (fondo vivo) ===================== */
function crearMundo() {
  const m = document.createElement("div"); m.id = "mundo"; m.setAttribute("aria-hidden", "true");
  const nube = (y, w, dur, dl, op) => `<div class="mu-nube" style="top:${y}vh;width:${w}vw;animation-duration:${dur}s;animation-delay:${dl}s;opacity:${op}"><svg viewBox="0 0 120 50"><path d="M18 42 Q2 42 5 29 Q8 18 22 21 Q26 6 43 8 Q55 1 66 12 Q80 8 88 21 Q106 18 108 33 Q110 43 94 43 Z" fill="#fff"/></svg></div>`;
  const edif = [[18, 74, 96, 0], [104, 54, 134, 1], [168, 90, 82, 2], [266, 62, 152, 0], [336, 92, 108, 1], [438, 58, 128, 2], [506, 104, 90, 0], [640, 50, 118, 1], [930, 70, 110, 2], [1010, 60, 150, 0], [1170, 66, 122, 2], [1244, 84, 98, 0], [1338, 58, 142, 1], [1404, 98, 86, 2], [1514, 72, 114, 0]], col = ["#BCC9DD", "#B0BFD6", "#C6D1E2"]; let v = "";
  edif.forEach(([x, w, h, c], i) => { const y = 300 - h; v += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col[c]}"/>`; for (let r = 0; r < Math.floor((h - 10) / 24); r++) for (let k = 0; k < Math.floor((w - 8) / 22); k++) v += `<rect x="${x + 8 + k * 22}" y="${y + 10 + r * 24}" width="10" height="12" rx="1" fill="${((i * 7 + r * 3 + k * 5) % 4) === 0 ? "#F4F7FB" : "#E2E9F3"}" opacity=".85"/>`; });
  const ciudad = `<svg class="mu-ciudad" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice"><polygon points="0,170 190,126 380,160 580,108 790,150 1000,118 1200,156 1410,114 1600,148 1600,300 0,300" fill="#CFD9E8"/>${v}<rect x="716" y="268" width="196" height="9" fill="#EFE4C8"/>${[0, 1, 2, 3, 4].map(k => `<rect x="${732 + k * 30}" y="206" width="11" height="64" fill="#E4D6B4"/>`).join("")}<polygon points="712,206 922,206 817,168" fill="#F3E9CF"/></svg>`;
  const rueda = (a, b, y, r) => `<circle cx="${a}" cy="${y}" r="${r}" fill="#141E2C"/><circle cx="${b}" cy="${y}" r="${r}" fill="#141E2C"/><circle cx="${a}" cy="${y}" r="${r * .4}" fill="#96A0AF"/><circle cx="${b}" cy="${y}" r="${r * .4}" fill="#96A0AF"/>`;
  const auto = c => `<svg viewBox="0 0 44 22"><path d="M2 16 Q2 12 6 11 L12 5 Q13.5 3.5 16 3.5 L29 3.5 Q31.5 3.5 33 5 L38 11 Q42 12 42 16 L42 18 L2 18Z" fill="${c}"/><path d="M14.5 5.6 L22 5.2 L22 11 L10.8 11 Z" fill="#CDE5F7"/><path d="M24 5.2 L29 5.4 L34 11 L24 11 Z" fill="#CDE5F7"/>${rueda(11, 33, 18.2, 3.6)}</svg>`;
  const bus = c => `<svg viewBox="0 0 62 28">${busG(c)}</svg>`;
  const veh = (svg, w, bottom, dur, dl, izq) => `<div class="mu-veh${izq ? " izq" : ""}" style="width:${w}vw;top:calc(${bottom}vh - ${(w * (svg.includes("62 28") ? 28 / 62 : 22 / 44)).toFixed(2)}vw);animation-duration:${dur}s;animation-delay:${dl}s">${svg}</div>`;
  m.innerHTML = `${ciudad}<div class="mu-av"><i></i></div><div class="mu-acera"></div><div class="mu-calle"><i></i></div>` +
    veh(bus("#34548C"), 7, 77.6, 34, -4, false) + veh(auto("#9AA6BA"), 4.6, 77.6, 26, -14, false) + veh(auto("#5B6B88"), 4.6, 79, 30, -6, true) + veh(bus("#0B1F5C"), 7, 79, 38, -20, true);
  deck.prepend(m);
}

/* ===================== arranque y cambio de diapositiva ===================== */
function montar() {
  crearMundo(); HUD.init();
  const gs = document.createElement("div"); gs.id = "guia-stage"; gs.setAttribute("aria-hidden", "true"); document.body.appendChild(gs); Guia.init();
  SLIDES.forEach((s, k) => { if (INIT[s.id]) INIT[s.id](els[k]); });
  document.addEventListener("click", e => { const g = e.target.closest("[data-ir]"); if (g) { e.preventDefault(); irId(g.dataset.ir); } });
  window.addEventListener("keydown", e => { if (e.key === "m" || e.key === "M") { if (!/INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) irId("mapa"); } });
  window.addEventListener("resize", () => { const id = SLIDES[IDX] && SLIDES[IDX].id; if (id) posiciona(id); });
}
function posiciona(id) {
  if (id === "cover") Guia.portada(); else if (id === "mapa") { const e = els[IDX]; ENTER.mapa && ENTER.mapa(e); } else if (id !== "cuestionario") Guia.casa();
}
window.onSlide = function (i) {
  const s = SLIDES[i], el = els[i], id = s.id, b = document.body.classList;
  b.toggle("en-m", el.classList.contains("m")); b.toggle("en-cover", id === "cover"); b.toggle("en-quiz", id === "cuestionario");
  Guia.activo(id !== "cuestionario"); const primera = !VIS.has(id); VIS.add(id);
  if (id !== "cuestionario" && id !== "cover") HUD.set(id);
  if (id !== "mapa") posiciona(id);
  if (ENTER[id]) ENTER[id](el);
  Guia.habla(id === "cover");
  if (id === "cover") { Guia.di("Bienvenidos. Soy SETPI y los acompaño en esta ruta.", 5200, .12); Guia.react("wave"); }
};

  { const sl = document.getElementById("cuestionario"); if(sl){ let act = sl.classList.contains("activa"); new MutationObserver(() => { const n = sl.classList.contains("activa"); if(n && !act) setTimeout(ledBarrido, 700); act = n; }).observe(sl, { attributes: true, attributeFilter: ["class"] }); } }

  let podioPintado = false, podioSig = "", ultimoTop3 = null;
  /* Dibuja el podio con el factor de tamaño `k` y lo ajusta MIDIENDO: si SETPI + nombre + bloque no caben en el alto real del panel

  function dibujarPodio(top3){

    try{
      const r = await api("quizReiniciar", TOKEN);
      if(!r.ok){ avisoPin(mhBtnReiniciar, TXT_REINICIAR); return; }
      mhBtnReiniciar.disabled = false; mhBtnReiniciar.textContent = TXT_REINICIAR; podioPintado = false; mostrarLobby();
    }catch(e){ avisoPin(mhBtnReiniciar, TXT_REINICIAR); }
  });

  try{
    const saved = sessionStorage.getItem("tj_host_token");
    if(saved){ TOKEN = saved; if(qrHero) qrHero.classList.remove("bloqueado"); mostrarLobby(); } else { fase("login"); }
  }catch(e){ fase("login"); }
})();
</script>
</body>
