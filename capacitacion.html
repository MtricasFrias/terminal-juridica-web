<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitación · Derecho de Petición y Terminal Jurídica</title>
<meta name="description" content="Capacitación SETP: derecho de petición, términos, respuesta de fondo y la Terminal Jurídica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* paleta real del SETP (la misma de los tableros institucionales: TransMusical SETP + Alcaldía) */
  --navy:#0B1F5C; --navy-2:#123a7a; --navy-deep:#071444; --blue:#159BD6; --blue-soft:#E6F4FB;
  --ocobo:#D62828; --ocobo-soft:#FBE6E6; --gold:#F0A800; --gold-soft:#FEF3DE;
  --cream:#EEF2F9; --paper:#FFFFFF; --ink:#0D1730; --ink-soft:#5B6A88; --line:#E0E6F1;
  --green:#00A830; --green-bg:#E4F6EA; --amber:#B9821C; --amber-bg:#FEF3DE; --red:#D62828; --red-bg:#FBE6E6;
  --shadow: 0 6px 20px rgba(11,31,92,.08), 0 20px 44px -20px rgba(11,31,92,.28);
  color-scheme:light;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0; height:100%; background:var(--navy); overflow:hidden;}
body{font-family:'Public Sans',system-ui,sans-serif; color:var(--ink);}
h1,h2,h3{font-family:'Barlow',sans-serif; font-weight:800; letter-spacing:-.01em; margin:0; text-wrap:balance;}
.mono{font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.logo-lockup{display:inline-flex; align-items:center; align-self:flex-start; background:#fff; border-radius:12px; padding:5px 10px; box-shadow:0 6px 16px rgba(0,0,0,.28); flex:none; position:relative; z-index:1;}
.logo-lockup img{height:32px; display:block;}
.foto-marca{position:absolute; inset:0; z-index:-1; overflow:hidden;}
.foto-marca img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.05);}
.foto-marca::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,20,68,.82) 0%, rgba(11,31,92,.86) 55%, rgba(11,31,92,.96) 100%);}
button{font-family:inherit; cursor:pointer;}
#deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
.slide{position:absolute; inset:0; display:flex; flex-direction:column; padding:6.5vh 6.5vw 10.5vh; opacity:0; pointer-events:none; transition:opacity .5s ease; background:var(--cream); color:var(--ink);}
.slide.activa{opacity:1; pointer-events:auto; z-index:1;}
.slide.navy{background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%); color:var(--cream);}
.slide.cream2{background:linear-gradient(160deg, var(--cream) 0%, #ECE6D8 100%);}

/* -------- entrada escalonada: pausada hasta que la diapositiva esté activa -------- */
.entra{animation: entraKF .65s cubic-bezier(.2,.8,.2,1) both; animation-play-state:paused;}
.slide.activa .entra{animation-play-state:running;}
@keyframes entraKF{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
.flota{animation:flotarKF 3.6s ease-in-out infinite;}
@keyframes flotarKF{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }
.gira-lento{animation:giraKF 22s linear infinite;}
@keyframes giraKF{ to{transform:rotate(360deg);} }
.pulso-dot{animation:pulsoKF 1.4s ease-in-out infinite;}
@keyframes pulsoKF{ 0%,100%{opacity:.4; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }
@keyframes dibujar{ to{stroke-dashoffset:0;} }
.linea-dibujo{stroke-dasharray:400; stroke-dashoffset:400; animation:dibujar 1.6s ease forwards; animation-play-state:paused;}
.slide.activa .linea-dibujo{animation-play-state:running;}
@keyframes balancearKF{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
.balancea{animation:balancearKF 4.2s ease-in-out infinite; transform-origin:50% 8%;}
@keyframes petaloCaer{ from{transform:translateY(-10vh) rotate(0deg); opacity:0;} 10%{opacity:.7;} to{transform:translateY(110vh) rotate(340deg); opacity:0;} }
.petalos-fondo{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.petalos-fondo span{position:absolute; top:0; width:9px; height:9px; border-radius:60% 0; background:var(--ocobo); opacity:.55; animation:petaloCaer linear infinite;}
.escena-viva{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.escena-viva svg{width:100%; height:100%; display:block;}
.ev-bal{transform-origin:800px 60px; animation:balancearKF 4.6s ease-in-out infinite;}
.ev-bus1{animation:evCruza 15s linear infinite;}
.ev-bus2{animation:evCruzaIzq 21s linear infinite; animation-delay:-9s;}
@keyframes evCruza{ from{transform:translateX(-220px);} to{transform:translateX(1820px);} }
@keyframes evCruzaIzq{ from{transform:translate(1820px,0) scale(-1,1);} to{transform:translate(-220px,0) scale(-1,1);} }
.ev-arbol{transform-box:fill-box; transform-origin:50% 100%; animation:meceKF 5s ease-in-out infinite;}
@keyframes meceKF{ 0%,100%{transform:rotate(-2.2deg);} 50%{transform:rotate(2.2deg);} }
.ev-sem-luz{opacity:.2; animation:semCicloKF 6s steps(1) infinite;}
.ev-sem-luz.ev-l2{animation-delay:-2s;} .ev-sem-luz.ev-l3{animation-delay:-4s;}
@keyframes semCicloKF{ 0%,32%{opacity:1;} 33%,100%{opacity:.2;} }
.ev-nube{animation:nubeKF 50s linear infinite;}
.ev-nube.ev-n2{animation-duration:65s; animation-delay:-20s;}
/* personaje: abogado con globo de pregunta */
.abogado{position:relative;}
.abogado .globo{animation:globoKF 3.4s ease-in-out infinite;}
@keyframes globoKF{ 0%,16%{opacity:0; transform:translateY(6px) scale(.8);} 26%,74%{opacity:1; transform:none;} 84%,100%{opacity:0; transform:translateY(-4px) scale(.9);} }
.abogado .brazo{transform-origin:top center; animation:brazoKF 3.4s ease-in-out infinite;}
@keyframes brazoKF{ 0%,16%{transform:rotate(0deg);} 26%,74%{transform:rotate(-18deg);} 84%,100%{transform:rotate(0deg);} }

.eyebrow{display:inline-flex; align-items:center; gap:8px; background:var(--blue-soft); color:var(--navy); font-size:clamp(11px,1.1vw,15px); font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:7px 18px; border-radius:999px; margin:0 0 2.2vh; align-self:flex-start; position:relative; z-index:1;}
.navy .eyebrow{background:rgba(255,255,255,.14); color:var(--cream);}
h2.tit{font-size:clamp(26px,3.3vw,48px); font-weight:700; color:var(--navy); line-height:1.14; margin-bottom:1.8vh; position:relative; z-index:1;}
.navy h2.tit, .navy h1{color:var(--cream);}
.cont{flex:1; min-height:0; display:flex; flex-direction:column; gap:1.8vh; position:relative; z-index:1;}
.footer{position:absolute; left:6.5vw; right:6.5vw; bottom:3.6vh; display:flex; justify-content:space-between; align-items:center; font-size:clamp(10px,.9vw,13px); color:var(--ink-soft); z-index:1;}
.navy .footer{color:rgba(246,243,236,.65);}
.grid{display:grid; gap:1.4vw;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);}
.split{display:grid; grid-template-columns:1.05fr .95fr; gap:3vw; align-items:center; flex:1; min-height:0;}
.split .ilustra{display:flex; align-items:center; justify-content:center; height:100%;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.6vw 1.8vw;}
.navy .card{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16); backdrop-filter:blur(2px);}
.tabla{width:100%; border-collapse:collapse; font-size:clamp(13px,1.1vw,16px);}
.tabla th{text-align:left; background:var(--navy); color:#fff; padding:1.1vh 1.1vw; font-size:clamp(11px,.85vw,13px); text-transform:uppercase; letter-spacing:.04em;}
.tabla th:first-child{border-radius:10px 0 0 0;} .tabla th:last-child{border-radius:0 10px 0 0;}
.tabla td{padding:1.1vh 1.1vw; border-bottom:1px solid var(--line); background:var(--paper); vertical-align:top;}
.tabla tr:last-child td{border-bottom:none;}
.contraste{display:grid; grid-template-columns:1fr 1fr; gap:1.4vw;}
.contraste .box{border-radius:16px; padding:1.6vw; box-shadow:var(--shadow); display:flex; gap:12px;}
.contraste .no{background:var(--red-bg); border:2px solid var(--red);}
.contraste .si{background:var(--green-bg); border:2px solid var(--green);}
.contraste .tag{font-weight:800; font-size:clamp(12px,1vw,15px); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.7vh; display:block;}
.contraste .no .tag{color:var(--red);} .contraste .si .tag{color:var(--green);}
.contraste blockquote{margin:0; font-size:clamp(12px,1.1vw,17px); line-height:1.5; font-style:italic; color:var(--ink);}
.timeline-v{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1vh; position:relative;}
.timeline-v::before{content:""; position:absolute; left:17px; top:8px; bottom:8px; width:2px; background:var(--line);}
.navy .timeline-v::before{background:rgba(255,255,255,.2);}
.timeline-v li{display:flex; gap:1vw; align-items:flex-start; font-size:clamp(12px,1.15vw,18px); line-height:1.42; position:relative;}
.timeline-v b.n{flex:none; width:2.1vw; height:2.1vw; min-width:30px; min-height:30px; border-radius:50%; background:var(--navy); color:#fff; font-family:'Barlow',sans-serif; display:flex; align-items:center; justify-content:center; font-size:clamp(12px,1.05vw,16px); z-index:1; box-shadow:0 0 0 5px var(--cream);}
.navy .timeline-v b.n{box-shadow:0 0 0 5px var(--navy-2); background:var(--ocobo);}
.chips-fuente{display:flex; flex-wrap:wrap; gap:.6vw; margin-top:1.2vh;}
.chip-fte{background:var(--gold-soft); color:#6b4d15; font-size:clamp(10px,.85vw,12px); font-weight:700; padding:4px 12px; border-radius:999px;}
.qr-box{display:flex; align-items:center; justify-content:center; gap:3vw; flex:1;}
.qr-box img{width:min(27vw,290px); height:min(27vw,290px); border-radius:18px; box-shadow:var(--shadow); background:#fff; padding:14px;}
.qr-tx{max-width:34vw;}
.qr-tx h2{color:var(--cream); font-size:clamp(24px,2.8vw,42px); margin-bottom:1.6vh;}
.qr-tx p{font-size:clamp(13px,1.2vw,18px); color:var(--blue-soft); line-height:1.5;}
.qr-tx .link{font-family:'IBM Plex Mono',monospace; font-size:clamp(11px,1vw,14px); color:var(--cream); background:rgba(255,255,255,.1); padding:8px 14px; border-radius:8px; display:inline-block; margin-top:1.6vh; word-break:break-all;}
.badge-tema{display:flex; flex-wrap:wrap; gap:.6vw; margin-top:1.4vh;}
.badge-tema span{background:rgba(255,255,255,.14); color:var(--cream); font-size:clamp(10px,.9vw,13px); font-weight:700; padding:5px 14px; border-radius:999px;}
.nav{position:fixed; left:0; right:0; bottom:0; height:60px; display:flex; align-items:center; justify-content:center; gap:14px; background:rgba(1,39,75,.92); backdrop-filter:blur(6px); z-index:50; opacity:0; transition:opacity .3s;}
#deck:hover .nav, .nav.despierto{opacity:1;}
.nav button{background:rgba(255,255,255,.14); color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center;}
.nav button:hover{background:rgba(255,255,255,.26);}
.nav button:disabled{opacity:.3; cursor:default;}
.nav .cont-n{color:#fff; font-family:'IBM Plex Mono',monospace; font-size:13px; min-width:64px; text-align:center;}
.progreso{position:fixed; left:0; top:0; height:4px; background:var(--ocobo); z-index:60; transition:width .35s ease;}
.speech{position:relative; background:var(--paper); border-radius:14px; padding:12px 16px; font-size:clamp(11px,1.05vw,15px); font-style:italic; box-shadow:var(--shadow); flex:1;}
.speech::after{content:""; position:absolute; left:22px; bottom:-9px; border:9px solid transparent; border-top-color:var(--paper);}
.avatar-mini{width:44px; height:44px; border-radius:50%; flex:none; box-shadow:var(--shadow);}
@media (max-width:900px){
  .g2,.g3,.contraste{grid-template-columns:1fr;}
  .split{grid-template-columns:1fr; gap:1.2vh;}
  .split .ilustra{order:-1; max-height:22vh;}
  .qr-box{flex-direction:column; gap:4vh;}
  .qr-tx{max-width:none; text-align:center;}
  .qr-box img{width:min(56vw,260px); height:min(56vw,260px);}
}
</style>
</head>
<body>
<div class="progreso" id="progreso" style="width:5%"></div>
<div id="deck"></div>
<div class="nav despierto" id="nav">
  <button id="btn-prev" aria-label="Anterior">←</button>
  <span class="cont-n mono" id="nav-cont">1 / 19</span>
  <button id="btn-next" aria-label="Siguiente">→</button>
  <button id="btn-full" aria-label="Pantalla completa" title="Pantalla completa" style="margin-left:10px">⛶</button>
</div>
<script>
/* ===================== ilustraciones SVG reutilizables ===================== */
function petalos(n){ let s=""; for(let i=0;i<n;i++){ const left=(Math.random()*100).toFixed(1), dur=(7+Math.random()*6).toFixed(1), delay=(-Math.random()*10).toFixed(1), sz=(6+Math.random()*7).toFixed(0); s+=`<span style="left:${left}%; width:${sz}px; height:${sz}px; animation-duration:${dur}s; animation-delay:${delay}s"></span>`; } return `<div class="petalos-fondo" aria-hidden="true">${s}</div>`; }

function svgBalanza(sz){ return `<svg class="flota" width="${sz}" height="${sz}" viewBox="0 0 200 200" aria-hidden="true">
  <line x1="100" y1="24" x2="100" y2="150" stroke="#F6F3EC" stroke-width="6" stroke-linecap="round"/>
  <rect x="70" y="150" width="60" height="10" rx="4" fill="#F6F3EC"/>
  <rect x="88" y="158" width="24" height="26" fill="#F6F3EC"/>
  <g class="balancea">
    <line x1="34" y1="46" x2="166" y2="46" stroke="#F6F3EC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="24" r="7" fill="#C9922B"/>
    <line x1="34" y1="46" x2="34" y2="84" stroke="#F6F3EC" stroke-width="3"/>
    <path d="M14,84 a20,14 0 0 0 40,0 Z" fill="#3D85C6"/>
    <line x1="166" y1="46" x2="166" y2="84" stroke="#F6F3EC" stroke-width="3"/>
    <path d="M146,84 a20,14 0 0 0 40,0 Z" fill="#D6488E"/>
  </g>
</svg>`; }

function svgMazo(color, sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 120 120" aria-hidden="true">
  <g class="flota">
    <rect x="14" y="70" width="58" height="26" rx="6" fill="${color}" transform="rotate(-28 43 83)"/>
    <rect x="52" y="58" width="14" height="52" rx="6" fill="${color}" opacity=".55" transform="rotate(-28 59 84)"/>
    <rect x="18" y="98" width="84" height="10" rx="5" fill="${color}" opacity=".35"/>
  </g>
</svg>`; }

function svgSobre(color, sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 160 120" aria-hidden="true" class="flota">
  <rect x="8" y="18" width="144" height="94" rx="10" fill="${color}" opacity=".16"/>
  <path d="M8,26 L80,78 L152,26" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="linea-dibujo"/>
  <rect x="8" y="18" width="144" height="94" rx="10" fill="none" stroke="${color}" stroke-width="6"/>
  <circle cx="80" cy="78" r="13" fill="var(--gold)"/>
  <path d="M74,78 l4,5 l9,-11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`; }

function svgEscudo(color, sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 120 140" aria-hidden="true" class="flota">
  <path d="M60,6 L110,24 V64 C110,100 88,122 60,134 C32,122 10,100 10,64 V24 Z" fill="${color}" opacity=".18"/>
  <path d="M60,6 L110,24 V64 C110,100 88,122 60,134 C32,122 10,100 10,64 V24 Z" fill="none" stroke="${color}" stroke-width="6" class="linea-dibujo"/>
  <path d="M38,66 l16,16 l30,-34" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`; }

function svgReloj(color, sz, min){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="6"/>
  <circle cx="50" cy="50" r="3.4" fill="${color}"/>
  <line x1="50" y1="50" x2="50" y2="22" stroke="${color}" stroke-width="4" stroke-linecap="round" class="gira-lento" style="transform-origin:50px 50px; animation-duration:${min}s"/>
  <line x1="50" y1="50" x2="68" y2="50" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>`; }

function svgHub(){ const areas=[["Financiera","var(--blue)",0],["Operativa","var(--ocobo)",1],["Administrativa","var(--gold)",2],["Planeación","#1E8F5F",3]];
  const pts=areas.map((a,i)=>{ const ang=(-90+ i*90)*Math.PI/180; const x=170+Math.cos(ang)*118, y=110+Math.sin(ang)*98; return {...a,x,y}; });
  const lineas = pts.map(p=>`<line x1="170" y1="110" x2="${p.x}" y2="${p.y}" stroke="var(--line)" stroke-width="3" class="linea-dibujo"/>`).join("");
  const nodos = pts.map((p,i)=>`<g class="flota" style="animation-delay:${i*.3}s"><circle cx="${p.x}" cy="${p.y}" r="30" fill="${p[1]}" opacity=".16"/><circle cx="${p.x}" cy="${p.y}" r="30" fill="none" stroke="${p[1]}" stroke-width="3"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-family="Manrope" font-weight="700" font-size="10" fill="var(--navy)">${p[0]}</text></g>`).join("");
  return `<svg width="340" height="220" viewBox="0 0 340 220" aria-hidden="true">${lineas}
    <circle cx="170" cy="110" r="42" fill="var(--navy)"/><text x="170" y="106" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="13" fill="#fff">Jurí-</text><text x="170" y="122" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="13" fill="#fff">dica</text>
    ${nodos}</svg>`;
}

function svgDomino(){ const n=6; let s=""; for(let i=0;i<n;i++){ const x=20+i*46; const delay=i*.18; s+=`<g style="transform-origin:${x+6}px 96px; animation:caeDomino .5s ease forwards; animation-delay:${.4+delay}s; animation-play-state:paused;" class="domino-pz"><rect x="${x}" y="36" width="12" height="60" rx="3" fill="${i<4?'var(--ocobo)':'var(--line)'}"/></g>`; }
  return `<svg width="320" height="120" viewBox="0 0 320 120" aria-hidden="true" style="overflow:visible"><line x1="0" y1="96" x2="320" y2="96" stroke="var(--line)" stroke-width="3"/>${s}</svg>
  <style>@keyframes caeDomino{ to{ transform:rotate(62deg);} } .slide.activa .domino-pz{animation-play-state:running;}</style>`;
}

function svgDashboardMini(){ return `<svg width="100%" height="100%" viewBox="0 0 420 240" aria-hidden="true">
  <rect x="6" y="6" width="408" height="228" rx="14" fill="var(--paper)" stroke="var(--line)" stroke-width="2"/>
  <rect x="24" y="24" width="180" height="16" rx="8" fill="var(--blue-soft)"/>
  <rect x="24" y="52" width="120" height="10" rx="5" fill="var(--line)"/>
  ${[0,1,2].map(i=>{ const y=80+i*44; const col=i===0?"var(--green)":i===1?"var(--amber)":"var(--red)"; return `<g class="flota" style="animation-delay:${i*.4}s"><rect x="24" y="${y}" width="372" height="34" rx="8" fill="var(--cream)"/><circle cx="42" cy="${y+17}" r="7" fill="${col}"/><rect x="60" y="${y+9}" width="150" height="8" rx="4" fill="var(--line)"/><rect x="330" y="${y+8}" width="50" height="18" rx="9" fill="${col}" opacity=".18"/></g>`; }).join("")}
  <circle cx="70" cy="212" r="10" fill="var(--navy)" class="flota"/>
  <circle cx="100" cy="212" r="10" fill="var(--ocobo)" class="flota" style="animation-delay:.3s"/>
  <circle cx="130" cy="212" r="10" fill="var(--gold)" class="flota" style="animation-delay:.6s"/>
</svg>`; }

function munecoPodio(color, corona){ return `<svg width="52" height="52" viewBox="0 0 46 46" aria-hidden="true">
  ${corona?'<polygon points="15,14 18,7 23,12 28,7 31,14" fill="var(--gold)"/>':''}
  <circle cx="23" cy="18" r="10" fill="${color}"/><circle cx="19.5" cy="17" r="1.6" fill="#fff"/><circle cx="26.5" cy="17" r="1.6" fill="#fff"/>
  <path d="M18,21 q5,5 10,0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M11,44 q12,-14 24,0 Z" fill="${color}"/></svg>`; }

function svgPodiumMini(){ return `<div style="display:flex; align-items:flex-end; justify-content:center; gap:10px; height:100%">
  <div class="flota" style="display:flex; flex-direction:column; align-items:center; animation-delay:.2s">${munecoPodio("var(--blue)",false)}<div style="width:64px; height:70px; background:linear-gradient(180deg,var(--blue),var(--navy-2)); border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:Barlow; font-weight:800">2°</div></div>

/* ===================== motor de navegación ===================== */
const deck = document.getElementById("deck");
SLIDES.forEach(s=>{ const el=document.createElement("section"); el.className="slide "+s.cls; el.id=s.id; el.innerHTML=s.html; deck.appendChild(el); });
let IDX = Math.max(0, Math.min(SLIDES.length-1, (parseInt((location.hash||"").replace("#",""),10)||1)-1));
const els = [...document.querySelectorAll(".slide")];
const navCont = document.getElementById("nav-cont"), btnPrev=document.getElementById("btn-prev"), btnNext=document.getElementById("btn-next"), btnFull=document.getElementById("btn-full"), progreso=document.getElementById("progreso");
function ir(i){
  IDX = Math.max(0, Math.min(SLIDES.length-1, i));
  els.forEach((el,k)=>el.classList.toggle("activa", k===IDX));
  navCont.textContent = (IDX+1)+" / "+SLIDES.length;
  progreso.style.width = (((IDX+1)/SLIDES.length)*100)+"%";
  btnPrev.disabled = IDX===0; btnNext.disabled = IDX===SLIDES.length-1;
  history.replaceState(null,"","#"+(IDX+1));
}
btnPrev.addEventListener("click", ()=>ir(IDX-1));
btnNext.addEventListener("click", ()=>ir(IDX+1));
btnFull.addEventListener("click", ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
window.addEventListener("keydown", e=>{
  if(["ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); ir(IDX+1); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); ir(IDX-1); }
  else if(e.key==="Home") ir(0);
  else if(e.key==="End") ir(SLIDES.length-1);
});
window.addEventListener("hashchange", ()=>{
  const n = parseInt((location.hash||"").replace("#",""),10);
  if(n && (n-1)!==IDX) ir(n-1);
});
let touchX=null;
deck.addEventListener("touchstart", e=>{ touchX=e.touches[0].clientX; }, {passive:true});
deck.addEventListener("touchend", e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 60) ir(IDX + (dx<0?1:-1));
  touchX=null;
}, {passive:true});
ir(IDX);

  function pintarRoster(jugadores){
    mhRoster.innerHTML = jugadores.map(j=>`<span style="display:flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.72rem;font-weight:700;color:var(--navy);animation:entraKF .35s both;">${avatarSVG(j.avatar,20)}${esc(j.jugador)}</span>`).join("");
    mhCuenta.textContent = jugadores.length + (jugadores.length===1 ? " persona en la sala" : " personas en la sala");
  }

  let podioPintado = false;
  async function actualizarPodio(){
    try{
      const r = await api("quizClasificacion");
      if(!r.tabla.length) return;
      const top3 = r.tabla.slice(0,3);
      const orden = [top3[1], top3[0], top3[2]];
      const alturas = [46, 66, 34], colores = ["var(--blue)","var(--gold)","var(--ocobo)"], nums = ["2°","1°","3°"];
      mhPodio.innerHTML = orden.map((f,i)=>{
        if(!f) return `<div style="width:26%; opacity:.2; height:${alturas[i]}px; background:var(--line); border-radius:6px 6px 0 0"></div>`;
        const muneco = i===1 ? avatarSVG(f.avatar, 46, "cuerpo") : avatarSVG(f.avatar, 34);
        return `<div style="display:flex; flex-direction:column; align-items:center; width:26%;">
          <div style="font-size:clamp(8px,.65vw,10px); font-weight:800; color:var(--navy); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:1px 6px; margin-bottom:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.jugador)}</div>
          <div style="margin-bottom:-4px">${muneco}</div>
          <div style="width:100%; height:${alturas[i]}px; background:linear-gradient(180deg,${colores[i]},var(--navy)); border-radius:6px 6px 0 0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:Barlow; font-weight:800; font-size:.8rem;">${nums[i]}</div>
        </div>`;
      }).join("");
      podioPintado = true;
    }catch(e){ /* reintenta solo */ }
  }

  /* mismo reloj compartido que usan los celulares: todos calculan la MISMA pregunta actual
     a partir del mismo "inicio", así que este panel nunca se desincroniza de lo que la gente ve. */
  function iniciarCurso(inicioMs){
    fase("curso");
    clearInterval(pollLobby);
    clearInterval(tickAnillo);
    tickAnillo = setInterval(()=>{
      const ciclo = (DURACION+TRANSICION)*1000;
      const transcurrido = Date.now() - inicioMs;
      const idx = Math.floor(transcurrido / ciclo);
      const restante = Math.max(0, DURACION - (transcurrido - idx*ciclo)/1000);
      if(idx >= TOTAL_PREGUNTAS){
        mhPreguntaNum.textContent = "Cuestionario terminado";
        mhAnillo.style.stroke = "var(--green)"; mhAnillo.style.strokeDashoffset = "0"; mhAnilloNum.textContent = "🏆";
        clearInterval(tickAnillo);
        return;
      }
      mhPreguntaNum.textContent = "Pregunta " + (idx+1) + " de " + TOTAL_PREGUNTAS;
      mhAnilloNum.textContent = Math.ceil(restante);
      mhAnillo.style.strokeDashoffset = String(CIRC * (1 - Math.max(0,restante)/DURACION));
      mhAnillo.style.stroke = restante <= 5 ? "var(--red)" : "var(--blue)";
    }, 200);
    actualizarPodio();
    clearInterval(pollClasif);
    pollClasif = setInterval(actualizarPodio, 2500);
  }

  async function sondearLobby(){
    try{
      const r = await api("quizEstadoSesion");
      DURACION = r.duracion || DURACION; TRANSICION = r.transicion !== undefined ? r.transicion : TRANSICION; TOTAL_PREGUNTAS = r.totalPreguntas || TOTAL_PREGUNTAS;
      pintarRoster(r.jugadores);
      if(r.estado === "en_curso" && r.inicio) iniciarCurso(parseInt(r.inicio,10));
    }catch(e){ /* reintenta solo */ }
  }

  function mostrarLobby(){
    fase("lobby");
    mhRoster.innerHTML = "";
    sondearLobby();
    clearInterval(pollLobby);
    pollLobby = setInterval(sondearLobby, 1400);
  }

  mhBtnEntrar.addEventListener("click", ()=>{
    mhErr.textContent = "";
    const pin = mhPin.value.trim();
    if(pin.length !== 4){ mhErr.textContent = "El PIN tiene 4 dígitos."; return; }
    TOKEN = pin;
    try{ sessionStorage.setItem("tj_host_token", TOKEN); }catch(e){}
    mostrarLobby();
  });
  mhPin.addEventListener("keydown", e=>{ if(e.key==="Enter") mhBtnEntrar.click(); });

  mhBtnIniciar.addEventListener("click", async ()=>{
    mhBtnIniciar.disabled = true; mhBtnIniciar.textContent = "Iniciando…";
    try{
      const r = await api("quizIniciar", TOKEN);
      if(!r.ok){ alert(r.error || "No se pudo iniciar."); mhBtnIniciar.disabled = false; mhBtnIniciar.textContent = "▶ Comenzar cuando estés listo"; return; }
    }catch(e){ alert(e.message); mhBtnIniciar.disabled = false; mhBtnIniciar.textContent = "▶ Comenzar cuando estés listo"; }
  });

  try{
    const saved = sessionStorage.getItem("tj_host_token");
    if(saved){ TOKEN = saved; mostrarLobby(); } else { fase("login"); }
  }catch(e){ fase("login"); }
})();
</script>
</body>
</html>
